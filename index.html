<meta name="mobile-web-app-capable" content="yes">

tailwind.config = { theme: { extend: {
  fontFamily: { grotesk:['"Space Grotesk"','sans-serif'], inter:['Inter','sans-serif'] }
} } };

<style>
  :root{
    --void:#0A0A0F; --glass:rgba(28,28,38,.85); --stroke:rgba(255,255,255,.08);
    --ink:#F8FAFC; --sec:#94A3B8; --mut:#64748B;
    --z:#22C55E;
  }
  html,body{margin:0;padding:0;background:var(--void);color:var(--ink);font-family:Inter,sans-serif;-webkit-tap-highlight-color:transparent}
  body{min-height:100dvh;overscroll-behavior:none;font-size:15px;line-height:22px}
  ::-webkit-scrollbar{display:none}
  *{scrollbar-width:none}
  .ambient{position:fixed;inset:0;z-index:0;pointer-events:none;transition:background .6s ease;
    background:radial-gradient(60% 40% at 100% 0%, color-mix(in srgb,var(--z) 16%, transparent), transparent 70%),
               radial-gradient(50% 35% at 0% 55%, color-mix(in srgb,var(--z) 8%, transparent), transparent 70%),
               radial-gradient(60% 40% at 80% 100%, rgba(129,140,248,.07), transparent 70%)}
  .g{font-family:"Space Grotesk",sans-serif}
  .num{font-variant-numeric:tabular-nums}
  .lbl{font-family:"Space Grotesk",sans-serif;font-size:11px;line-height:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .ui{font-size:12px;line-height:16px;font-weight:500;letter-spacing:.01em}
  .sm{font-size:13px;line-height:18px}
  .sec{color:var(--sec)} .mut{color:var(--mut)}
  .glass{background:var(--glass);backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);border:1px solid var(--stroke);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 10px 36px rgba(0,0,0,.38);border-radius:20px}
  .sub{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.05);border-radius:14px}
  .deep{background:rgba(10,10,15,.7);border:1px solid rgba(255,255,255,.05);border-radius:14px}
  .well{background:var(--void);border:1px solid var(--stroke);border-radius:12px;color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s;width:100%}
  .well:focus{border-color:#818CF8;box-shadow:0 0 0 4px rgba(129,140,248,.15)}
  .well::placeholder,.bare::placeholder,.cell::placeholder{color:#475569}
  .bare{background:transparent;border:0;outline:none;color:inherit;width:100%;min-width:0}
  .bare:focus{box-shadow:0 1px 0 0 #818CF8}
  .cell{background:#0A0A0F;border:1px solid rgba(255,255,255,.08);border-radius:8px;color:var(--ink);outline:none;padding:4px 6px;min-width:0;text-align:center;font-size:14px}
  .cell:focus{border-color:#818CF8}
  input[type=time],input[type=date]{color-scheme:dark}
  input[type=time]::-webkit-calendar-picker-indicator{opacity:.45;margin-left:2px}
  .ico{width:20px;height:20px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .ico.fill{fill:currentColor}
  .press{transition:transform .15s ease,background-color .2s,opacity .2s}
  .press:active{transform:scale(.96)}
  .chip{font-family:"Space Grotesk",sans-serif;font-size:11px;line-height:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    padding:3px 8px;border-radius:8px;background:rgba(255,255,255,.06);white-space:nowrap}
  .bar{height:6px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .acc-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .3s ease}
  .acc-body>div{overflow:hidden}
  .acc.closed .acc-body{grid-template-rows:0fr}
  .acc .chev{transition:transform .3s ease}
  .acc.closed .chev{transform:rotate(180deg)}
  .rng circle{transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
  .fade{animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .strike{text-decoration:line-through;opacity:.6}
  .sheet-wrap{position:fixed;inset:0;z-index:60;background:rgba(10,10,15,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
  .sheet-wrap.open{opacity:1;pointer-events:auto}
  .sheet{transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);border-radius:24px 24px 0 0;width:100%;max-width:480px;max-height:88dvh;overflow-y:auto}
  .sheet-wrap.open .sheet{transform:none}
  .fab{transition:transform .25s ease, box-shadow .3s}
  .fab.on{transform:rotate(45deg)}
  .toast{position:fixed;left:50%;top:calc(88px + env(safe-area-inset-top));transform:translate(-50%,-12px);opacity:0;z-index:80;transition:all .25s;pointer-events:none}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  textarea{resize:none}
  .pt-safe{padding-top:env(safe-area-inset-top)}
  .pb-safe{padding-bottom:env(safe-area-inset-bottom)}
  .wave{animation:wave 3.2s linear infinite}
  @keyframes wave{from{transform:translateX(0)}to{transform:translateX(84px)}}
  .bub{animation:bub 4s ease-in infinite;opacity:0}
  @keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:.7}100%{transform:translateY(-120px);opacity:0}}
</style>
</head>
<body>

<!-- ============ HEADER ============ -->
<header class="fixed top-0 inset-x-0 z-50 pt-safe" style="background:rgba(10,10,15,.78);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid rgba(255,255,255,.05)">
  <div class="h-[72px] px-5 flex items-center justify-between gap-2 max-w-[520px] mx-auto">
    <div class="flex items-center gap-2.5 min-w-0">
      <img src="icon-192.png" alt="Raherishi" class="w-9 h-9 rounded-[10px] shrink-0" style="border:1px solid rgba(255,255,255,.12)">
      <div class="flex flex-col min-w-0">
        <div class="flex items-center gap-1.5 min-w-0">
          <span class="g text-[20px] leading-7 font-semibold tracking-tight shrink-0">Raherishi</span>
          <span class="lbl sec truncate" id="hdr-zone">• Health Hub</span>
        </div>
        <span class="ui sec truncate">Living beyond the charted</span>
      </div>
    </div>
    <div class="flex items-center gap-2 shrink-0">
      <div class="lbl px-2.5 py-1 rounded-full flex items-center gap-1.5" style="background:rgba(255,255,255,.06)">
        <span class="w-1.5 h-1.5 rounded-full" style="background:var(--z)"></span><span id="hdr-date" class="num">—</span>
      </div>
      <button class="relative w-10 h-10 rounded-full flex items-center justify-center press" data-act="tab:profile" aria-label="Profile and settings"
        style="background:linear-gradient(140deg,#818CF8,#22C55E 55%,#F59E0B)">
        <span class="w-[36px] h-[36px] rounded-full flex items-center justify-center g font-bold" style="background:#13131A">R</span>
        <span id="hdr-sync" class="absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full border-2" style="border-color:#0A0A0F;background:#27272A"></span>
      </button>
    </div>
  </div>
</header>

<!-- ============ MAIN ============ -->
<main class="relative z-10 w-full max-w-[520px] mx-auto px-4 pb-36" style="padding-top:calc(84px + env(safe-area-inset-top))">
  <div class="w-full p-1.5 rounded-full flex items-center justify-between mb-3" style="background:#0E0E13;border:1px solid rgba(255,255,255,.05)" id="rail"></div>
  <div id="datebar" class="mb-4"></div>
  <div id="view"></div>
</main>

<!-- ============ FAB + DOCK ============ -->
<nav class="fixed bottom-0 left-0 right-0 z-40 pb-safe pointer-events-none">
  <div class="max-w-[520px] mx-auto px-4 pb-4 flex items-center gap-3">
    <div class="flex-1 h-16 rounded-full flex items-center justify-around px-2 pointer-events-auto"
      style="background:rgba(31,31,37,.82);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.08);box-shadow:0 4px 24px rgba(0,0,0,.35)" id="dock"></div>
    <button class="fab w-14 h-14 rounded-full flex items-center justify-center pointer-events-auto press shrink-0" id="fab" data-act="fab" aria-label="Quick capture"
      style="background:#E4E1E9;color:#131318;box-shadow:0 4px 20px rgba(0,0,0,.4),0 0 16px color-mix(in srgb,var(--z) 45%,transparent)">
      <svg class="ico" style="width:28px;height:28px;stroke-width:2.2"><use href="#i-plus"/></svg>
    </button>
  </div>
</nav>

<!-- ============ QUICK CAPTURE SHEET ============ -->
<div class="sheet-wrap" id="sheet">
  <div class="sheet glass p-5 pb-8 space-y-4">
    <div class="w-12 h-1 rounded-full mx-auto" style="background:#35343a"></div>
    <div class="flex items-center justify-between">
      <div>
        <h3 class="g text-[17px] font-semibold">Quick Capture</h3>
        <p class="ui sec">Idea, journal, note — one tap</p>
      </div>
      <button class="w-10 h-10 rounded-full flex items-center justify-center press" style="background:#35343a" data-act="closeSheet" aria-label="Close"><svg class="ico" style="width:18px;height:18px"><use href="#i-x"/></svg></button>
    </div>
    <div class="flex gap-2 flex-wrap" id="sheet-tags"></div>
    <textarea id="sheet-text" data-draft="sheet" rows="4" class="well p-3 sm" placeholder="What's on your mind?"></textarea>
    <button class="w-full py-3 rounded-xl g font-semibold press" style="background:var(--z);color:#0A0A0F" data-act="sheetSave" id="sheet-save">Save note</button>
    <div class="grid grid-cols-2 gap-2">
      <button class="sub p-3 flex items-center gap-2.5 text-left press" data-act="water:250"><svg class="ico" style="color:#38BDF8"><use href="#i-drop"/></svg><div><span class="sm font-semibold block">+250 ml water</span><span class="ui sec">Add to the jar</span></div></button>
      <button class="sub p-3 flex items-center gap-2.5 text-left press" data-act="qMeal"><svg class="ico" style="color:#22C55E"><use href="#i-food"/></svg><div><span class="sm font-semibold block">Ate just now</span><span class="ui sec">Logs next meal + time</span></div></button>
      <button class="sub p-3 flex items-center gap-2.5 text-left press" data-act="qMover"><svg class="ico" style="color:#818CF8"><use href="#i-lotus"/></svg><div><span class="sm font-semibold block">Next MOVER</span><span class="ui sec">Complete ritual step</span></div></button>
      <button class="sub p-3 flex items-center gap-2.5 text-left press" data-act="sync"><svg class="ico" style="color:#F59E0B"><use href="#i-sync"/></svg><div><span class="sm font-semibold block">Sync now</span><span class="ui sec">Push to Sheets</span></div></button>
    </div>
  </div>
</div>

<div class="toast glass px-4 py-2.5 sm font-medium" id="toast"></div>

<script>
/* =====================================================================
   RAHERISHI LIFE OS v4 — single-file PWA

/* ---------- helpers ---------- */
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today = () => ymd(new Date());
const parseD = s => new Date(s+'T00:00:00');
const addDays = (s,n) => { const d=parseD(s); d.setDate(d.getDate()+n); return ymd(d); };
const dayDiff = (a,b) => Math.round((parseD(b)-parseD(a))/864e5);
const nowHM = () => { const d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); };
const mins = t => { if(!t) return null; const [h,m]=String(t).split(':').map(Number); return isNaN(h)?null:h*60+(m||0); };
const nightMins = t => { const m = mins(t); return m==null?null:(m<720?m+1440:m); };   // 01:00 counts as later than 23:00
const t12 = hm => { if(!hm) return '—'; const [h,m]=hm.split(':').map(Number); return ((h%12)||12)+':'+pad(m)+(h<12?' AM':' PM'); };
const fmtD = (s,o={weekday:'short',day:'numeric',month:'short'}) => parseD(s).toLocaleDateString('en-IN',o);
const monthKey = s => s.slice(0,7);
const monthName = k => new Date(k+'-01T00:00:00').toLocaleDateString('en-IN',{month:'long',year:'numeric'});
const monthShort = k => new Date(k+'-01T00:00:00').toLocaleDateString('en-IN',{month:'short',year:'numeric'});
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => parseFloat(String(v??'').replace(/[^\d.]/g,'')) || 0;
const inr = n => '₹'+Math.round(n).toLocaleString('en-IN');
const inrShort = n => n>=1e7 ? '₹'+(n/1e7).toFixed(2)+'Cr' : n>=1e5 ? '₹'+(n/1e5).toFixed(2)+'L' : inr(n);
const ic = (id,cls='',style='') => `<svg class="ico ${cls}" style="${style}"><use href="#i-${id}"/></svg>`;
const ago = ts => { const s=(Date.now()-ts)/1000; if(s<60) return 'just now'; if(s<3600) return Math.floor(s/60)+'m ago'; if(s<86400) return Math.floor(s/3600)+'h ago'; return Math.floor(s/86400)+'d ago'; };
const hm2 = m => { m=Math.round(m); m=Math.abs(m); return m>=60?Math.floor(m/60)+'h '+pad(m%60)+'m':m+'m'; };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);

  };
}
function blankDay(){
  return { at:0, wo:null, water:[], cre:false, creT:'', meals:{}, cheat:'', protein:false, mv:{}, sleep:{wake:'',slept:''},
    tl:{}, ct:{}, ps:{}, txt:{book0:'',scribe0:'',film0:'',learn0:''}, dw:'', j:{steps:'',rate:0,wealth:false,wn:'',text:''}, per:{} };
}
const BLANK = Object.freeze(blankDay());
function normDay(d){ const b = blankDay(); d = d||{};
  return { ...b, ...d, sleep:{...b.sleep,...(d.sleep||{})}, txt:{...b.txt,...(d.txt||{})}, j:{...b.j,...(d.j||{})},
    mv:d.mv||{}, meals:d.meals||{}, tl:d.tl||{}, ct:d.ct||{}, ps:d.ps||{}, per:d.per||{}, water:Array.isArray(d.water)?d.water:[] }; }
function normCfg(c){ const b = defCfg(); c = c||{};
  const m = { ...b, ...c, goals:{...b.goals,...(c.goals||{})}, splits:{...b.splits,...(c.splits||{})}, challenge:{...b.challenge,...(c.challenge||{})},
    kpi:{...b.kpi,...(c.kpi||{})}, wk:c.wk||{}, wg:Array.isArray(c.wg)?c.wg:b.wg, tasks:Array.isArray(c.tasks)?c.tasks:[] };
  if(!Array.isArray(m.meals)||!m.meals.length) m.meals = b.meals;
  if(!Array.isArray(m.tl)||!m.tl.length) m.tl = b.tl;
  if(!Array.isArray(m.periodic)) m.periodic = b.periodic;
  if((c.rev||0) < 2){ m.meals = MEALS2(); m.challenge.start = '2026-10-05'; m.rev = 2; }   // 11 Nov: Rishi's meal times + real 90-day start
  return m; }

/* ---------- state ---------- */
function freshState(){
  return { v:4, days:{}, cfg:defCfg(), cfgAt:0, notes:[], improve:[], clients:[], clientsAt:0, wdScores:{},
    sheetsUrl:'', lastSync:0, dirty:[], cfgDirty:false, delNotes:[], delImprove:[], history:{}, migrated:false };
}
function fromV3Day(ds){            // convert a v3 day snapshot into a v4 day
  const d = blankDay(); if(!ds) return d;
  d.water = (ds.water||[]).map(i=>({ ml:OLD_WATER[i]||250, t:'' }));
  for(let i=0;i<6;i++){ const done = ds.meals?.[i], f = ds.mealTxt?.[i]; if(done||f) d.meals[i] = { d:!!done, at:'', q:'', f:f||'' }; }
  d.mv = ds.movers||{}; d.cre = !!ds.creatine; d.cheat = ds.cheat||'';
  d.sleep.wake = ds.sleep?.wake||'';
  Object.entries(ds.checks||{}).forEach(([k,v])=>{ if(/^ct\d/.test(k)) d.ct[k.slice(2)] = v; if(/^ps\d/.test(k)) d.ps[k.slice(2)] = v; });
  ['book0','scribe0','film0','learn0'].forEach(k=>{ if(ds.inlines?.[k]) d.txt[k] = ds.inlines[k]; });
  d.dw = ds.kpi?.dw||''; d.at = 1;
  return d;
}
function load(){
  let s; try{ s = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(s && s.v===4){ s = { ...freshState(), ...s }; s.cfg = normCfg(s.cfg); Object.keys(s.days).forEach(k=>s.days[k]=normDay(s.days[k])); return s; }
  const st = freshState();
  let o; try{ o = JSON.parse(localStorage.getItem(OLDKEY)); }catch(e){}
  if(o){                             // one-time migration v3 -> v4 (the v3 copy is left in place)
    const day = fromV3Day(o); day.at = o.updatedAt||Date.now();
    if(o.lastDay) st.days[o.lastDay] = day;
    st.cfg.kpi = { earning:o.kpi?.earning||'', bank:o.kpi?.bank||'', clients:o.kpi?.clients||'' };
    Object.entries(o.checks||{}).forEach(([k,v])=>{ if(/^(g|cb)\d/.test(k)) st.cfg.wk[k] = v; });
    st.cfg.wg = [o.inlines?.wg0||'', o.inlines?.wg1||'', o.inlines?.wg2||''];
    st.cfg.idea = o.contentIdea||'';
    st.notes = o.notes||[]; st.improve = o.improve||[]; st.clients = o.clients||[]; st.clientsAt = o.clientsAt||0;
    st.wdScores = o.wdScores||{}; st.sheetsUrl = o.sheetsUrl||''; st.history = o.history||{};
    st.cfgAt = Date.now(); st.cfgDirty = true; st.migrated = true;
    if(o.lastDay) st.dirty = [o.lastDay];
  }
  return st;
}
let state = load();
let cfg = state.cfg;
let ui = (()=>{ try{ return JSON.parse(localStorage.getItem(UIKEY))||{}; }catch(e){ return {}; } })();
ui.tab = ui.tab || 'health'; ui.closed = ui.closed || {}; ui.noteFilter = ui.noteFilter || 'All'; ui.noteTag = ui.noteTag || 'Idea';

ui.openEx = {}; ui.date = today(); ui.custom = false;

function saveLocal(){ state.cfg = cfg; try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ toast('Storage full — export & clear history'); } }

const peek = date => state.days[date] || BLANK;
function day(date = ui.date){ if(!state.days[date]) state.days[date] = blankDay(); return state.days[date]; }
function markDay(date = ui.date){ const d = day(date); d.at = Date.now(); if(!state.dirty.includes(date)) state.dirty.push(date);

function markMisc(){ const t = today(); if(!state.dirty.includes(t)) state.dirty.push(t); editSeq++; saveLocal(); }

/* =====================================================================
   METRICS
   ===================================================================== */
const splitKey = date => DAY_SPLIT[parseD(date).getDay()];
function ensureWo(date = ui.date){
  const d = day(date);
  if(!d.wo){
    const key = splitKey(date), sp = cfg.splits[key];
    const ex = sp.ex.map((e,i)=>({ n:e.n, g:i<sp.pc?'p':'s', s:e.sets.map(x=>({ kg:x.kg, reps:x.reps, d:false })) }));
    d.wo = { split:key, ex, target:ex.reduce((a,e)=>a+e.s.reduce((b,x)=>b+num(x.reps),0),0), warm:false, stretch:false, push:'', squat:'' };
  }
  return d.wo;
}
/* Auto workout score (Rishi's rules):
   5 = every set + warm-up + stretch
   4 = 80%+ of planned reps, or all but 1 exercise complete
   3 = all but 2 exercises, or 15/21 sets, or main muscle done but support skipped
   2 = 3 exercises, or a home workout (push-ups / squats)
   1 = showed up: warm-up or a few sets
   0 = nothing */
function woStats(date){
  const d = peek(date), key = d.wo?.split || splitKey(date), rest = key==='rest';
  const wo = d.wo || { ex:[], target:0, warm:false, stretch:false, push:'', squat:'' };
  const ex = wo.ex||[], n = ex.length;
  let setsT = 0, setsD = 0, repsD = 0, full = 0, any = 0, pN = 0, pFull = 0;
  ex.forEach(e=>{ const dn = e.s.filter(s=>s.d); setsT += e.s.length; setsD += dn.length; repsD += dn.reduce((a,s)=>a+num(s.reps),0);
    const isFull = e.s.length>0 && dn.length===e.s.length; if(isFull) full++; if(dn.length) any++; if(e.g==='p'){ pN++; if(isFull) pFull++; } });
  const target = wo.target || setsT*10;
  const home = num(wo.push)+num(wo.squat) > 0;
  const spl = cfg.splits[key] || {};
  let score, why;
  if(n && setsD===setsT && wo.warm && wo.stretch){ score=5; why='All sets + warm-up + stretch'; }
  else if(n>=3 && (repsD>=0.8*target || full>=n-1)){ score=4; why = full>=n-1 ? `${full}/${n} exercises complete` : `${repsD}/${target} reps (80%+)`; }
  else if(n>=3 && (full>=n-2 || setsD>=Math.ceil(setsT*15/21) || (pN && pFull===pN))){
    score=3; why = full>=n-2 ? `${full}/${n} exercises complete` : setsD>=Math.ceil(setsT*15/21) ? `${setsD}/${setsT} sets` : `All ${spl.p||'main'} done, ${spl.s||'support'} skipped`; }
  else if(any>=3 || home){ score=2; why = home && any<3 ? `Home workout (${num(wo.push)} push-ups, ${num(wo.squat)} squats)` : `${any} exercises`; }
  else if(wo.warm || setsD>0){ score=1; why='Showed up — light session'; }
  else { score=0; why='No workout logged yet'; }
  if(rest && score===0){ score=null; why='Rest day'; }
  if(!d.wo && !rest && state.wdScores[date]!=null) { score = state.wdScores[date]; why = 'Score from earlier version'; }
  return { n, setsT, setsD, repsD, target, full, any, score, why, rest, pct: target ? Math.round(repsD/target*100) : 0, key };
}
function sleepHrs(date){
  const prev = state.days[addDays(date,-1)]?.sleep?.slept, wake = peek(date).sleep.wake;
  if(!prev || !wake) return null;
  let m = mins(wake) - mins(prev); if(m<=0) m += 1440; return Math.round(m/6)/10;
}
function mealStat(date, i){
  const m = peek(date).meals[i], ideal = cfg.meals[i]?.t;
  if(!m || !m.d) return { k:'pending' };
  const at = m.at || ideal, diff = mins(at)-mins(ideal), thr = num(cfg.goals.lateMin)||30;
  return { k: diff>thr ? 'late' : diff< -thr ? 'early' : 'ontime', diff };
}
function dietStats(date){
  const d = peek(date), n = cfg.meals.length;
  const water = d.water.reduce((a,w)=>a+num(w.ml),0), target = num(cfg.goals.water)||4000;
  let done = 0, ontime = 0, late = 0;
  cfg.meals.forEach((_,i)=>{ const s = mealStat(date,i); if(s.k!=='pending'){ done++; if(s.k==='late') late++; else ontime++; } });
  const pct = Math.round((done/n*0.6 + Math.min(water/target,1)*0.3 + (d.cre?0.1:0))*100);
  return { water, target, done, ontime, late, n, pct };
}
const moverCount = date => { const mv = peek(date).mv; return MOVERS.filter(m=>mv[m[0]]).length; };
function habits(date){
  const d = peek(date), w = woStats(date), g = cfg.goals;
  const wakeOk = d.sleep.wake ? mins(d.sleep.wake) <= mins(g.wake) : null;
  const sleepOk = d.sleep.slept ? nightMins(d.sleep.slept) <= nightMins(g.sleep) : null;
  const workout = w.rest && w.score==null ? 'rest' : (w.score!=null && w.score>=2);
  const items = [ wakeOk, workout, d.protein, d.j.wealth, sleepOk, moverCount(date)===5 ];
  const done = items.filter(v=>v===true||v==='rest').length;
  return { wakeOk, sleepOk, workout, done, total:items.length, hrs:sleepHrs(date) };
}
const logged = date => (state.days[date]?.at||0) > 0;

/* ---------- midnight: records are per date, so nothing is wiped ---------- */
function rollover(){
  const t = today(); if(t===lastToday) return false;
  if(ui.date===lastToday) ui.date = t;
  lastToday = t;
  const cutoff = addDays(t,-KEEP_DAYS);
  Object.keys(state.days).forEach(k=>{ if(k<cutoff && !state.dirty.includes(k)) delete state.days[k]; });
  saveLocal(); return true;
}

function ring(id, label){

function setRing(id, frac, val, sub, color){
  const c = document.getElementById(id+'-c'); if(!c) return;
  c.setAttribute('stroke-dashoffset', (100.53*(1-Math.max(0,Math.min(1,frac||0)))).toFixed(2));
  if(color) c.setAttribute('stroke', color);
  document.getElementById(id+'-v').textContent = val;
  document.getElementById(id+'-s').textContent = sub;
}

const setW = (id, p) => { const e=document.getElementById(id); if(e) e.style.width = Math.max(0,Math.min(100,p))+'%'; };

function weekDiet(date){
  let logged = 0, ontime = 0, water = 0, protein = 0; const late = {};
  for(let k=0;k<7;k++){ const ds = addDays(date,-k), d = peek(ds); water += d.water.reduce((a,w)=>a+num(w.ml),0); if(d.protein) protein++;
    cfg.meals.forEach((m,i)=>{ const s = mealStat(ds,i); if(s.k==='pending') return; logged++; if(s.k==='late'){ late[i] = late[i]||{n:m.n,late:0,sum:0}; late[i].late++; late[i].sum += s.diff; } else ontime++; }); }
  const worst = Object.values(late).sort((a,b)=>b.late-a.late||b.sum-a.sum)[0];
  return { logged, ontime, water:water/7, protein, worst: worst ? { ...worst, avg: worst.sum/worst.late } : null };
}
function exHistory(name, before){
  const out = [];
  Object.keys(state.days).filter(k=>k<before).sort().reverse().forEach(k=>{
    const e = state.days[k].wo?.ex?.find(x=>x.n===name); if(!e) return;
    const dn = e.s.filter(s=>s.d); if(!dn.length) return;
    const top = [...dn].sort((a,b)=>num(b.kg)-num(a.kg)||num(b.reps)-num(a.reps))[0];
    out.push({ date:k, kg:num(top.kg), reps:num(top.reps) });
  });
  return out;
}

function challengeStats(){
  const c = cfg.challenge, t = today(), len = Math.max(1,Math.round(num(c.len))||90);

function spark(vals){
  if(vals.length<2) return '';
  const mn = Math.min(...vals), mx = Math.max(...vals), r = mx-mn||1;
  const pts = vals.map((v,i)=>`${(i/(vals.length-1)*80).toFixed(1)},${(22-(v-mn)/r*20).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 80 24" class="w-20 h-6 shrink-0" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function rangeStats(from, to){
  const s = { n:0, wsum:0, wn:0, sets:0, reps:0, sh:0, shn:0, wakeOk:0, wakeN:0, sleepOk:0, sleepN:0, water:0, meals:0, ontime:0, protein:0, wealth:0, steps:0, stepsN:0, rate:0, rateN:0, late:{} };
  for(let ds=from; ds<=to; ds=addDays(ds,1)){ if(!logged(ds)) continue; s.n++; const d = peek(ds), w = woStats(ds), h = habits(ds), dt = dietStats(ds);
    if(w.score!=null){ s.wsum += w.score; s.wn++; } s.sets += w.setsD; s.reps += w.repsD;
    if(h.hrs!=null){ s.sh += h.hrs; s.shn++; } if(h.wakeOk!=null){ s.wakeN++; s.wakeOk += h.wakeOk; } if(h.sleepOk!=null){ s.sleepN++; s.sleepOk += h.sleepOk; }
    s.water += dt.water; s.meals += dt.done; s.ontime += dt.ontime; s.protein += d.protein?1:0; s.wealth += d.j.wealth?1:0;
    if(num(d.j.steps)){ s.steps += num(d.j.steps); s.stepsN++; } if(d.j.rate){ s.rate += d.j.rate; s.rateN++; }
    cfg.meals.forEach((m,i)=>{ const st = mealStat(ds,i); if(st.k==='late'){ s.late[m.n] = s.late[m.n]||{c:0,sum:0}; s.late[m.n].c++; s.late[m.n].sum += st.diff; } }); }
  return { ...s, wavg: s.wn?s.wsum/s.wn:null, shAvg: s.shn?s.sh/s.shn:null, waterAvg: s.n?s.water/s.n:0,
    stepsAvg: s.stepsN?Math.round(s.steps/s.stepsN):null, rateAvg: s.rateN?s.rate/s.rateN:null };
}
function weekInsights(date){

/* =====================================================================

function derive(){
  const date = ui.date;
  if(ui.tab==='health'){
    const w = woStats(date), dt = dietStats(date), mv = moverCount(date), hrs = sleepHrs(date), d = peek(date), h = habits(date);
    const scCol = w.score==null ? '#94A3B8' : SCORE[w.score];
    setRing('r-w', (w.score||0)/5, w.score==null?'Rest':w.score+'/5', `${w.setsD}/${w.setsT} sets`, scCol==='#27272A'?'#3F3F46':scCol);
    setRing('r-d', dt.pct/100, dt.pct+'%', `${dt.done}/${dt.n} meals`);
    setRing('r-m', mv/5, mv*20+'%', `${mv}/5 done`);
    setRing('r-s', (hrs||0)/8, hrs!=null?hrs+'h':'—', hrs==null?'add times':hrs>=7?'Recovered':'Short', '#818CF8');
    const live = Math.round(((w.score||0)/5*100 + dt.pct + mv*20 + Math.min((hrs||0)/8,1)*100)/4);
    setTxt('live-pct', 'Live '+live+'%');
    setTxt('wo-score', w.score==null?'R':w.score); setTxt('wo-why', w.why);
    const sb = document.getElementById('wo-scorebox'); if(sb){ sb.style.background = scCol+'1F'; sb.style.border = '1px solid '+scCol+'55'; document.getElementById('wo-score').style.color = scCol==='#27272A'?'#94A3B8':scCol; }
    setTxt('wo-ex', `${w.full}/${w.n}`); setTxt('wo-sets', `${w.setsD}/${w.setsT}`); setTxt('wo-reps', `${w.repsD}/${w.target}`);
    setW('wo-bar', w.pct); setTxt('b-wo', w.score==null?'Rest':w.score+'/5');
    setTxt('wo-sub', `${w.n?w.n+' exercises • ':''}${w.pct}% reps`);
    setTxt('water-l', +(dt.water/1000).toFixed(2)+' L');
    setTxt('water-pct', Math.round(dt.water/dt.target*100)+'%'); setW('water-bar', dt.water/dt.target*100);
    setTxt('b-diet', `${+(dt.water/1000).toFixed(1)}L`);
    setTxt('diet-sub', `${dt.done}/${dt.n} meals • ${dt.ontime} on time • creatine ${d.cre?'taken':'pending'}`);
    setTxt('b-mov', `${mv*20}%`); setTxt('mov-sub', `${mv}/5 completed • Mind mastery`);
    setTxt('b-sleep', hrs!=null?hrs+' H':'—');
    setTxt('sleep-sub', `Woke ${d.sleep.wake?t12(d.sleep.wake):'—'} • sleep ${d.sleep.slept?t12(d.sleep.slept):'—'}`);
    setTxt('sleep-hrs', hrs!=null?hrs+' h':'—');
    const wo = document.getElementById('wake-ok'); if(wo){ wo.textContent = h.wakeOk==null?'Goal '+t12(cfg.goals.wake):h.wakeOk?'Before goal':'After goal'; wo.style.color = h.wakeOk==null?'#64748B':h.wakeOk?'#22C55E':'#EF4444'; }
    const so = document.getElementById('sleep-ok'); if(so){ so.textContent = h.sleepOk==null?'Goal '+t12(cfg.goals.sleep):h.sleepOk?'Before goal':'After goal'; so.style.color = h.sleepOk==null?'#64748B':h.sleepOk?'#22C55E':'#EF4444'; }
    setTxt('tl-count', `${Object.values(d.tl).filter(Boolean).length} / ${cfg.tl.length}`);
  }
  if(ui.tab==='wealth'){
    const k = cfg.kpi, T = { earning:100000, bank:150000, clients:35, dw:5 };
    [['earning',v=>`${inr(v)} of ${inr(T.earning)}`],['bank',v=>`${inr(v)} of ${inr(T.bank)}`],['clients',()=>'Direct mandates'],['dw',()=>'Focused hours this day']].forEach(([key,sub])=>{
      const v = num(key==='dw'?peek(date).dw:k[key]), p = Math.round(v/T[key]*100);
      setTxt(`k-${key}-pct`, p+'%'); setW(`k-${key}-bar`, p);
      setTxt(`k-${key}-chip`, key==='earning'||key==='bank' ? inrShort(v) : p>=100?'Hit':(+(T[key]-v).toFixed(1))+(key==='dw'?'h':'')+' left');
      setTxt(`k-${key}-sub`, sub(v));
    });
    const tot = state.clients.reduce((a,c)=>a+num(c.a),0);
    setTxt('pipe-total', `${state.clients.length} • ${inrShort(tot)}/mo`);
  }
  if(ui.tab==='profile'){
    setTxt('b-imp', state.improve.length);
    setTxt('b-exp', ({today:'Today',week:'7D',fortnight:'15D',month:'30D'})[ui.range]);
    const bytes = new Blob([localStorage.getItem(KEY)||'']).size;
    const st = document.getElementById('storage');
    if(st) st.innerHTML = [['Phone cache',(bytes/1024).toFixed(1)+' KB'],['Days on phone',Object.keys(state.days).length],
      ['Notes / ideas',state.notes.length+' / '+state.improve.length],['Last sync',state.lastSync?ago(state.lastSync):'never']]
      .map(([l,v])=>`<div class="sub p-3"><p class="ui sec">${l}</p><p class="g text-[17px] font-semibold num">${v}</p></div>`).join('');
    buildReport(false);
  }
}

function setDate(ds){ if(!ds) return; if(ds>today()) ds = today(); ui.date = ds; ui.openEx = {}; ui.custom = false; render(true); }
document.addEventListener('click', e=>{
  if(e.target.id==='sheet'){ closeSheet(); return; }          // tap on the dimmed background
  const el = e.target.closest('[data-act]'); if(!el) return;
  if(el.tagName==='A') e.preventDefault();
  const [act, a, b] = el.dataset.act.split(':');
  const date = ui.date, isToday = date===today();
  switch(act){
    case 'tab': ui.tab = a; saveUI(); render(true); window.scrollTo({top:0,behavior:'smooth'}); return;
    case 'acc': ui.closed[a] = !ui.closed[a]; saveUI(); document.getElementById('acc-'+a).classList.toggle('closed', ui.closed[a]); return;
    case 'dateShift': setDate(addDays(date, +a)); return;
    case 'dateToday': setDate(today()); return;
    case 'goDate': setDate(a); return;
    case 'cyc': { const e = ensureWo(date).ex[+a], dn = e.s.filter(s=>s.d).length, nx = (dn+1)%(e.s.length+1);
      e.s.forEach((s,j)=>s.d = j<nx); markDay(); render(); return; }
    case 'setDone': { const s = ensureWo(date).ex[+a].s[+b]; s.d = !s.d; markDay(); render(); return; }
    case 'openEx': ui.openEx[a] = !ui.openEx[a]; render(); return;
    case 'saveDefault': { const wo = ensureWo(date), e = wo.ex[+a], sp = cfg.splits[wo.split];
      if(sp?.ex[+a]){ sp.ex[+a].n = e.n; sp.ex[+a].sets = e.s.map(s=>({ kg:num(s.kg), reps:num(s.reps) })); markCfg(); toast(e.n+' saved as plan default'); } return; }
    case 'woFlag': { const wo = ensureWo(date); wo[a] = !wo[a]; markDay(); render(); return; }
    case 'water': { day(date).water.push({ ml:+a, t:isToday?nowHM():'' }); markDay(); render(); toast(`+${a} ml`); return; }
    case 'unwater': day(date).water.splice(+a,1); markDay(); render(); return;
    case 'customToggle': ui.custom = !ui.custom; render(); setTimeout(()=>$('#custom-ml')?.focus(),50); return;
    case 'customAdd': { const v = Math.round(num($('#custom-ml')?.value)); if(!v||v>3000) return toast('Enter ml between 1 and 3000');
      day(date).water.push({ ml:v, t:isToday?nowHM():'' }); ui.custom = false; markDay(); render(); toast(`+${v} ml`); return; }
    case 'creatine': { const d = day(date); d.cre = !d.cre; d.creT = d.cre && isToday ? nowHM() : ''; markDay(); render(); return; }
    case 'meal': { const d = day(date), m = d.meals[a] = d.meals[a]||{ d:false, at:'', q:'', f:'' }; m.d = !m.d;
      if(m.d && !m.at) m.at = isToday ? nowHM() : cfg.meals[+a].t; markDay(); render(); return; }
    case 'protein': day(date).protein = !day(date).protein; markDay(); render(); return;
    case 'mover': { const d = day(date); d.mv[a] = !d.mv[a]; linkMover(d,a); markDay(); render(); return; }
    case 'tl': day(date).tl[a] = !day(date).tl[a]; markDay(); render(); return;
    case 'ct': day(date).ct[a] = !day(date).ct[a]; markDay(); render(); return;
    case 'ps': { const d = day(date); d.ps[a] = !d.ps[a]; if(a==='0') d.mv.R = d.ps[0]; if(a==='1') d.mv.S = d.ps[1]; markDay(); render(); return; }
    case 'rate': { const d = day(date); d.j.rate = d.j.rate===+a ? 0 : +a; markDay(); render(); return; }
    case 'jWealth': day(date).j.wealth = !day(date).j.wealth; markDay(); render(); return;
    case 'perToggle': { const d = day(date); if(d.per[a]) delete d.per[a]; else d.per[a] = true; markDay(); render(); return; }
    case 'perSave': { const v = num($('#per-'+a)?.value); if(!v) return toast('Enter a value first'); day(date).per[a] = v; markDay(); render(); toast('Saved'); return; }
    case 'wk': cfg.wk[a] = !cfg.wk[a]; markCfg(); render(); return;
    case 'taskAdd': { const t = $('#tf-t').value.trim(); if(!t) return toast('Write the task first');
      const task = { id:uid(), t, c:$('#tf-c').value.trim(), type:$('#tf-type').value, m:$('#tf-m').value, qty:Math.max(1,Math.round(num($('#tf-q').value))||1), done:0, ts:Date.now() };
      cfg.tasks.push(task); ui.taskForm = { m:task.m, type:task.type, qty:1 }; ui.drafts.taskT = ''; ui.drafts.taskC = ''; saveUI(); markCfg(); render(); toast('Task added'); return; }
    case 'taskInc': case 'taskDec': { const t = cfg.tasks.find(x=>x.id===a); if(!t) return; const q = Math.max(1,num(t.qty));
      t.done = Math.max(0, Math.min(q, num(t.done)+(act==='taskInc'?1:-1))); if(t.done>=q) t.doneAt = Date.now(); markCfg(); render(); return; }
    case 'taskDel': { const t = cfg.tasks.find(x=>x.id===a); if(!t || !confirm('Delete "'+t.t+'"?')) return; cfg.tasks = cfg.tasks.filter(x=>x.id!==a); markCfg(); render(); return; }
    case 'addClient': state.clients.push({n:'',a:''}); state.clientsAt = Date.now(); markMisc(); render();
      setTimeout(()=>{ const ins = document.querySelectorAll('#pipe-list input[data-in$=".n"]'); ins[ins.length-1]?.focus(); }, 50); return;
    case 'delClient': if(state.clients[a] && (state.clients[a].n||state.clients[a].a) && !confirm('Remove '+(state.clients[a].n||'this client')+'?')) return;
      state.clients.splice(+a,1); state.clientsAt = Date.now(); markMisc(); render(); return;
    case 'nf': ui.noteFilter = a; saveUI(); render(); return;
    case 'nt': ui.noteTag = a; saveUI(); render(); return;
    case 'addNote': { const ta = $('#note-text'); if(!ta.value.trim()) return toast('Write something first');
      addNote(ta.value.trim(), ui.noteTag); ui.drafts.note = ''; saveUI(); render(); return; }
    case 'delNote': if(!confirm('Delete this note?')) return; state.notes = state.notes.filter(n=>n.ts!==+a); state.delNotes.push(+a); markMisc(); render(); return;
    case 'fab': openSheet(); return;
    case 'closeSheet': closeSheet(); return;
    case 'st': ui.sheetTag = a; saveUI(); paintSheetTags(); return;
    case 'sheetSave': { const ta = $('#sheet-text'), v = ta.value.trim(); if(!v) return toast('Write something first');
      if(ui.sheetTag==='Journal'){ const d = day(date); d.j.text = (d.j.text?d.j.text+'\n\n':'') + `[${t12(nowHM())}] ` + v; markDay(); toast('Added to '+fmtD(date,{day:'numeric',month:'short'})+' journal'); }
      else addNote(v, ui.sheetTag);
      ta.value = ''; ui.drafts.sheet = ''; saveUI(); closeSheet(); render(); return; }
    case 'qMeal': { const d = day(date), nx = cfg.meals.findIndex((_,i)=>!d.meals[i]?.d); if(nx<0){ toast('All meals logged'); return; }
      d.meals[nx] = { q:'', f:'', ...(d.meals[nx]||{}), d:true, at: isToday?nowHM():cfg.meals[nx].t }; markDay(); render(); toast(cfg.meals[nx].n+' logged at '+t12(d.meals[nx].at)); return; }
    case 'qMover': { const d = day(date), nx = MOVERS.find(m=>!d.mv[m[0]]); if(!nx){ toast('MOVERS already complete'); return; }
      d.mv[nx[0]] = true; linkMover(d,nx[0]); markDay(); render(); toast(nx[2]+' complete'); return; }
    case 'sync': syncNow(true); return;
    case 'saveUrl': { const u = $('#sheets-url').value.trim();
      if(u && !/^https:\/\/script\.google(usercontent)?\.com\//.test(u)) return toast('That doesn’t look like an Apps Script URL');
      state.sheetsUrl = u; saveLocal(); toast(u?'URL saved — syncing…':'Sync disconnected'); paintSync(); if(u) syncNow(true); return; }
    case 'addImp': { const ta = $('#imp-text'); if(!ta.value.trim()) return toast('Describe the idea first');
      ui.impCat = $('#imp-cat').value; state.improve.push({ text:ta.value.trim(), cat:ui.impCat, ts:Date.now() }); ui.drafts.imp = ''; saveUI(); markMisc(); render(); toast('Idea saved'); return; }
    case 'delImp': if(!confirm('Delete this idea?')) return; state.improve = state.improve.filter(m=>m.ts!==+a); state.delImprove.push(+a); markMisc(); render(); return;
    case 'tlAdd': cfg.tl.push(['21:00','New step']); markCfg(); render(); return;
    case 'tlDel': if(!confirm('Remove "'+cfg.tl[+a][1]+'"?')) return; cfg.tl.splice(+a,1); markCfg(); render(); return;
    case 'perAdd': cfg.periodic.push({ id:uid(), n:a==='1'?'New measurement':'New check-in', every:14, val:a==='1', unit:'' }); markCfg(); render(); return;
    case 'perDel': if(!confirm('Remove "'+cfg.periodic[+a].n+'"?')) return; cfg.periodic.splice(+a,1); markCfg(); render(); return;
    case 'range': ui.range = a; saveUI(); render(); return;
    case 'csv': case 'excsv': case 'txt': exportFile(act); return;
    case 'resetDay': if(!confirm('Clear everything logged today (workout, diet, water, sleep, journal…)?')) return;
      state.days[today()] = blankDay(); markDay(today()); render(); toast('Today cleared'); return;
    default: return;
  }
});
function linkMover(d,k){ if(k==='R') d.ps[0] = !!d.mv.R; if(k==='S') d.ps[1] = !!d.mv.S; }
function addNote(text, tag){ state.notes.push({ text, tag, ts:Date.now() }); markMisc(); toast(tag+' saved'); }

document.addEventListener('change', e=>{ if(e.target.dataset?.actInput==='datePick' && e.target.value) setDate(e.target.value); });
document.addEventListener('input', e=>{
  const el = e.target;
  if(el.dataset?.draft){ ui.drafts[el.dataset.draft] = el.value; saveUI(); return; }
  if(!el.dataset || !el.dataset.in) return;
  const path = el.dataset.in.split('.'), head = path.shift();
  let root, kind;
  if(head==='d'){ root = day(ui.date); kind = 'd'; if(path[0]==='wo') ensureWo(ui.date); }
  else if(head==='prev'){ root = day(addDays(ui.date,-1)); kind = 'prev'; }
  else if(head==='cfg'){ root = cfg; kind = 'cfg'; }
  else { root = state; kind = 'misc'; path.unshift(head); }
  let o = root; for(let i=0;i<path.length-1;i++){ if(o[path[i]]==null) o[path[i]] = {}; o = o[path[i]]; }
  o[path[path.length-1]] = el.value;
  if(kind==='d' && path[0]==='meals'){ const m = root.meals[path[1]]; if(m.d===undefined) m.d = false; if(path[2]==='at' && el.value) m.d = true; }
  if(kind==='d' && path[0]==='wo' && path[2]==='n'){ const sp = cfg.splits[root.wo.split]; if(sp?.ex[+path[1]]){ sp.ex[+path[1]].n = el.value; markCfg(); } }
  if(path[0]==='clients') state.clientsAt = Date.now();
  if(kind==='d') markDay(); else if(kind==='prev') markDay(addDays(ui.date,-1)); else if(kind==='cfg') markCfg(); else markMisc();
  derive();
});

function restoreDrafts(){ document.querySelectorAll('[data-draft]').forEach(el=>{ const v = ui.drafts[el.dataset.draft]; if(v && !el.value) el.value = v; }); }

/* =====================================================================
   GOOGLE SHEETS SYNC (same code.gs API as v3)
   ===================================================================== */
function snap(date){
  const d = peek(date), w = woStats(date), dt = dietStats(date), h = habits(date);
  const dayNotes = state.notes.filter(n=>ymd(new Date(n.ts))===date).map(n=>`[${n.tag}] ${n.text}`);
  if(d.j.text) dayNotes.unshift('[Journal] '+d.j.text);
  const payload = { v:4, day:d };
  if(date===today()){ payload.cfg = cfg; payload.cfgAt = state.cfgAt; }
  return { date, workoutPct:w.pct, dietPct:dt.pct, moversPct:moverCount(date)*20, sleepHrs:h.hrs??'', waterMl:dt.water,
    earning:num(cfg.kpi.earning), bank:num(cfg.kpi.bank), clients:num(cfg.kpi.clients), deepWork:num(d.dw),
    rating:w.score??'', notes:dayNotes.join(' | '), wdScores:JSON.stringify(state.wdScores), updatedAt:d.at||Date.now(),
    stateJson:JSON.stringify(payload) };
}
function setSync(s, msg=''){ syncState = { s, msg }; paintSync(); }
function paintSync(){
  const s = state.sheetsUrl ? syncState.s : 'off';
  const col = { off:'#27272A', busy:'#F59E0B', ok:'#22C55E', err:'#EF4444' }[s] || '#94A3B8';
  const hd = $('#hdr-sync'); if(hd) hd.style.background = col;
  const dot = document.getElementById('sync-dot'); if(!dot) return;
  dot.style.background = col; dot.style.boxShadow = s==='ok'||s==='busy' ? `0 0 8px ${col}` : 'none';
  setTxt('sync-title', { off:'Not connected', busy:'Syncing…', ok:'Synced', err:'Sync error' }[s]);
  setTxt('sync-msg', s==='err' ? syncState.msg : state.lastSync ? 'Last sync '+ago(state.lastSync)+(isDirty()?' • changes pending':'') : state.sheetsUrl ? 'Waiting for first sync' : 'Paste your Apps Script URL above');
  setTxt('b-sync', { off:'Offline', busy:'…', ok:'Live', err:'Error' }[s]);
}
async function api(method, params, body){
  const url = state.sheetsUrl.trim();
  const q = params ? '?'+new URLSearchParams(params).toString() : '';
  const r = await fetch(url+q, method==='POST'
    ? { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body), redirect:'follow' }
    : { method:'GET', redirect:'follow' });
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j = await r.json(); if(!j.ok) throw new Error(j.error||'Server error'); return j;
}
async function push(){
  const seq = editSeq, dates = [...new Set([...state.dirty, today()])];
  await api('POST', null, {
    action:'save', days:dates.map(snap),
    notes:state.notes, improvements:state.improve, delNotes:state.delNotes, delImprove:state.delImprove,
    clients:state.clients.map((c,i)=>({ idx:i+1, name:c.n, amount:num(c.a) })), clientsAt:state.clientsAt,
    wdScores:state.wdScores
  });
  state.delNotes = []; state.delImprove = [];
  if(seq===editSeq){ state.dirty = []; state.cfgDirty = false; }
}
async function pull(from, to){
  const j = await api('GET', { action:'get', from: from||addDays(today(),-100), to: to||today() });
  let best = null;
  (j.daily||[]).forEach(r=>{
    let ds = null; try{ ds = JSON.parse(r.stateJson||'null'); }catch(e){}
    const { stateJson, ...lite } = r; state.history[r.date] = lite;
    if(ds && ds.v===4){
      const loc = state.days[r.date];
      if(!state.dirty.includes(r.date) && (!loc || (ds.day?.at||0) > (loc.at||0))) state.days[r.date] = normDay(ds.day);
      if(ds.cfg && (ds.cfgAt||0) > (state.cfgAt||0) && (!best || ds.cfgAt > best.cfgAt)) best = ds;
    } else if(ds && !state.days[r.date]) state.days[r.date] = fromV3Day(ds);
  });
  if(best && !state.cfgDirty){ cfg = state.cfg = normCfg(best.cfg); state.cfgAt = best.cfgAt; }
  const merge = (local, remote, dels) => { const m = new Map(local.map(x=>[x.ts,x])); (remote||[]).forEach(x=>{ if(!dels.includes(x.ts)) m.set(x.ts,x); }); return [...m.values()]; };
  state.notes = merge(state.notes, (j.notes||[]).map(n=>({ text:String(n.text), tag:n.tag, ts:Number(n.ts) })), state.delNotes);
  state.improve = merge(state.improve, (j.improvements||[]).map(n=>({ text:String(n.text), cat:n.cat, ts:Number(n.ts) })), state.delImprove);
  if(j.clients && Number(j.clientsAt||0) > (state.clientsAt||0)){
    state.clients = j.clients.map(c=>({ n:String(c.name??''), a:c.amount===''||c.amount==null?'':String(c.amount) }));
    state.clientsAt = Number(j.clientsAt);
  }
  if(j.wdScores) Object.entries(j.wdScores).forEach(([d,s])=>{ if(!state.days[d]?.wo && !state.dirty.includes(d)) state.wdScores[d] = Number(s)||0; });
  if(!num(cfg.kpi.earning) && !num(cfg.kpi.bank)){       // after migration: seed KPIs from the latest synced day
    const lastRow = (j.daily||[]).filter(r=>num(r.earning)||num(r.bank)).pop();
    if(lastRow){ cfg.kpi.earning = String(lastRow.earning||''); cfg.kpi.bank = String(lastRow.bank||''); cfg.kpi.clients = String(lastRow.clients||''); }
  }
  return j;
}
async function syncNow(manual, onLoad){
  if(!state.sheetsUrl.trim()){ if(manual) toast('Add your Sheets URL in Profile → Settings'); setSync('off'); return; }
  if(syncing) return; syncing = true; setSync('busy');
  try{
    if(onLoad){ await pull(); if(isDirty()) await push(); }
    else { if(isDirty() || manual) await push(); await pull(); }
    state.lastSync = Date.now(); saveLocal(); setSync('ok');
    // never rebuild the screen while the user is typing or the capture sheet is open
    if(typing() || $('#sheet').classList.contains('open')){ pendingRender = true; derive(); } else render();
    if(manual) toast('Synced with Google Sheets');
  }catch(err){
    setSync('err', String(err.message||err)); if(manual) toast('Sync failed: '+(err.message||err));
  }
  syncing = false;
}

/* =====================================================================
   REPORTS / EXPORT
   ===================================================================== */
function rangeDates(){ const t = today(); const n = { today:0, week:6, fortnight:14, month:29 }[ui.range]; return [addDays(t,-n), t]; }
function rowFor(ds){
  if(logged(ds)){ const w = woStats(ds), dt = dietStats(ds), h = habits(ds), d = peek(ds);
    return { date:ds, workoutScore:w.score??'', workoutPct:w.pct, exercisesDone:w.full, setsDone:w.setsD, repsDone:w.repsD, warmup:d.wo?.warm?1:0, stretch:d.wo?.stretch?1:0,
      dietPct:dt.pct, mealsLogged:dt.done, mealsOnTime:dt.ontime, mealsLate:dt.late, waterMl:dt.water, creatine:d.cre?1:0, highProtein:d.protein?1:0,
      moversPct:moverCount(ds)*20, wake:d.sleep.wake, slept:d.sleep.slept, sleepHrs:h.hrs??'', wakeOnTime:h.wakeOk==null?'':+h.wakeOk, sleepOnTime:h.sleepOk==null?'':+h.sleepOk,
      steps:d.j.steps, dayRating:d.j.rate||'', wealthActivity:d.j.wealth?1:0, wealthNote:d.j.wn, deepWork:d.dw, habits:`${h.done}/${h.total}`,
      weight:d.per?.weight||'', journal:d.j.text }; }
  const r = state.history[ds]; if(!r) return null;
  return { date:ds, workoutScore:r.rating, workoutPct:r.workoutPct, dietPct:r.dietPct, waterMl:r.waterMl, moversPct:r.moversPct, sleepHrs:r.sleepHrs, deepWork:r.deepWork };
}
const COLS = ['date','workoutScore','workoutPct','exercisesDone','setsDone','repsDone','warmup','stretch','dietPct','mealsLogged','mealsOnTime','mealsLate','waterMl','creatine','highProtein',
  'moversPct','wake','slept','sleepHrs','wakeOnTime','sleepOnTime','steps','dayRating','wealthActivity','wealthNote','deepWork','habits','weight','journal'];
function collectRows(){ const [from,to] = rangeDates(), rows = []; for(let d=from; d<=to; d=addDays(d,1)){ const r = rowFor(d); if(r) rows.push(r); } return { from, to, rows }; }
function reportText({from,to,rows}){
  const label = { today:'Today', week:'Last 7 days', fortnight:'Last 15 days', month:'Last 30 days' }[ui.range];
  const s = rangeStats(from,to), cs = challengeStats(), cur = monthKey(today());
  const L = [];
  L.push('RAHERISHI LIFE OS — REPORT', `${label}: ${from} → ${to}`, `Days logged: ${s.n}`, '');
  L.push(`${String(cfg.challenge.title).toUpperCase()} — Day ${Math.max(0,Math.min(cs.dayN,cs.len))}/${cs.len}`,
    `  Sleep routine ${cs.sleep}%  |  Diet + workout ${cs.dietWorkout}%  |  Finance clarity ${cs.finance}%`, '');
  L.push('WORKOUT', `  Avg score ${s.wavg!=null?s.wavg.toFixed(1):'—'}/5 over ${s.wn} sessions  |  ${s.sets} sets, ${s.reps} reps`);
  const prog = {};
  for(let ds=from; ds<=to; ds=addDays(ds,1)) (peek(ds).wo?.ex||[]).forEach(e=>{ const dn = e.s.filter(x=>x.d); if(!dn.length) return; const top = Math.max(...dn.map(x=>num(x.kg)));
    prog[e.n] = prog[e.n]||{first:top,last:top,n:0}; prog[e.n].last = top; prog[e.n].n++; });
  Object.entries(prog).forEach(([n,p])=>L.push(`  ${n}: ${p.n} session${p.n>1?'s':''}, top set ${p.first}kg → ${p.last}kg`));
  L.push('', 'DIET', `  Meals logged ${s.meals}, on time ${s.ontime} (${s.meals?Math.round(s.ontime/s.meals*100):0}%)  |  Water avg ${(s.waterAvg/1000).toFixed(1)}L  |  High-protein ${s.protein}/${s.n} days`);
  Object.entries(s.late).sort((a,b)=>b[1].c-a[1].c).forEach(([n,v])=>L.push(`  LATE: ${n} ${v.c}× (avg +${hm2(v.sum/v.c)})`));
  L.push('', 'SLEEP', `  Avg ${s.shAvg!=null?s.shAvg.toFixed(1):'—'}h  |  Woke on time ${s.wakeOk}/${s.wakeN}  |  Slept on time ${s.sleepOk}/${s.sleepN}`,
    `  Steps avg ${s.stepsAvg??'—'}  |  Day rating avg ${s.rateAvg!=null?s.rateAvg.toFixed(1):'—'}/5`);
  L.push('', 'WEALTH', `  Money activity ${s.wealth}/${s.n} days  |  Earning ${inr(num(cfg.kpi.earning))}  |  Bank ${inr(num(cfg.kpi.bank))}  |  Clients ${num(cfg.kpi.clients)}`);
  const od = cfg.tasks.filter(t=>t.m<cur && num(t.done)<Math.max(1,num(t.qty))), tm = cfg.tasks.filter(t=>t.m===cur);
  if(od.length) L.push('  OVERDUE: '+od.map(t=>`${t.t} (${num(t.done)}/${Math.max(1,num(t.qty))}, since ${monthName(t.m)})`).join('; '));
  if(tm.length) L.push(`  This month: ${tm.filter(t=>num(t.done)>=Math.max(1,num(t.qty))).length}/${tm.length} tasks done`);
  L.push('', 'DAILY LOG');
  rows.forEach(r=>L.push(`  ${r.date}  Gym ${r.workoutScore===''||r.workoutScore==null?'-':r.workoutScore}/5  Diet ${r.dietPct??'-'}%  H2O ${(num(r.waterMl)/1000).toFixed(1)}L  Sleep ${r.sleepHrs||'-'}h  Wake ${r.wake||'-'}  Habits ${r.habits||'-'}`));
  if(!rows.length) L.push('  (no days in range yet)');
  const notes = state.notes.filter(n=>{ const d = ymd(new Date(n.ts)); return d>=from && d<=to; }).sort((a,b)=>a.ts-b.ts);
  L.push('', `NOTES & IDEAS (${notes.length})`);
  notes.forEach(n=>{ const d = new Date(n.ts); L.push(`  [${n.tag}] ${ymd(d)} ${pad(d.getHours())}:${pad(d.getMinutes())} — ${n.text.replace(/\n/g,' ')}`); });
  const js = rows.filter(r=>r.journal); if(js.length){ L.push('', 'JOURNAL'); js.forEach(r=>L.push(`  ${r.date}: ${String(r.journal).replace(/\n/g,' ')}`)); }
  L.push('', `Generated ${new Date().toLocaleString('en-IN')}`);
  return L.join('\n');
}
async function buildReport(fetchRemote){
  if(fetchRemote && state.sheetsUrl){ const [from,to] = rangeDates(); try{ await pull(from,to); saveLocal(); }catch(e){ toast('Using phone data — Sheets unreachable'); } }
  const data = collectRows();
  const pre = document.getElementById('report'); if(pre) pre.textContent = reportText(data);
  return data;
}
async function exportFile(kind){
  toast(state.sheetsUrl ? 'Fetching full history…' : 'Building report…');
  const data = await buildReport(true);
  const q = v => { const s = String(v??''); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  let content, mime = 'text/csv;charset=utf-8', ext = 'csv', name = 'daily';
  if(kind==='csv') content = [COLS.join(','), ...data.rows.map(r=>COLS.map(c=>q(r[c])).join(','))].join('\n');
  else if(kind==='excsv'){ name = 'gym'; const L = ['date,split,group,exercise,set,kg,reps,done'];
    for(let ds=data.from; ds<=data.to; ds=addDays(ds,1)){ const wo = peek(ds).wo; if(!wo) continue;
      wo.ex.forEach(e=>e.s.forEach((s,j)=>L.push([ds,wo.split,e.g==='p'?'main':'support',e.n,j+1,num(s.kg),num(s.reps),s.d?1:0].map(q).join(',')))); }
    content = L.join('\n'); }
  else { content = reportText(data); mime = 'text/plain;charset=utf-8'; ext = 'txt'; name = 'report'; }
  const blob = new Blob([content], { type:mime }), url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `lifeos-${name}-${ui.range}-${today()}.${ext}`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 1500);
  toast(ext.toUpperCase()+' downloaded');
}

/* =====================================================================
   BOOT
   ===================================================================== */
saveLocal();
render(true);
syncNow(false, true);
if(state.migrated){ state.migrated = false; saveLocal(); setTimeout(()=>toast('Upgraded to Life OS v4 — your data came along'), 800); }
setInterval(()=>{
  if(rollover()){ if(typing()) pendingRender = true; else render(); }
  if(state.sheetsUrl && (isDirty() || Date.now()-state.lastSync>120000)) syncNow(false); else paintSync();
}, 30000);
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible'){ if(rollover()) render(); syncNow(false); }
  else if(state.sheetsUrl && isDirty()) syncNow(false);
});
</script>
