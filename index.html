<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Raherishi Life OS</title>
<meta name="theme-color" content="#0A0A0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life OS">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { void:'#0A0A0F', health:'#22C55E', wealth:'#F59E0B', happy:'#818CF8', neutral:'#94A3B8', ink:'#F8FAFC', muted:'#64748B' },
  fontFamily: { grotesk:['"Space Grotesk"','sans-serif'], inter:['Inter','sans-serif'] }
} } };
</script>
<style>
  :root{
    --void:#0A0A0F; --glass:rgba(28,28,38,.85); --stroke:rgba(255,255,255,.08); --hi:rgba(255,255,255,.15);
    --ink:#F8FAFC; --sec:#94A3B8; --mut:#64748B; --line:#27272A;
    --health:#22C55E; --wealth:#F59E0B; --happy:#818CF8; --neutral:#94A3B8;
    --z:var(--health);
  }
  html,body{margin:0;padding:0;background:var(--void);color:var(--ink);font-family:Inter,sans-serif;-webkit-tap-highlight-color:transparent}
  body{min-height:100dvh;overscroll-behavior:none;font-size:15px;line-height:22px}
  ::-webkit-scrollbar{display:none}
  *{scrollbar-width:none}
  .ambient{position:fixed;inset:0;z-index:0;pointer-events:none;transition:background .6s ease;
    background:radial-gradient(60% 40% at 100% 0%, color-mix(in srgb,var(--z) 16%, transparent), transparent 70%),
               radial-gradient(50% 35% at 0% 55%, color-mix(in srgb,var(--z) 8%, transparent), transparent 70%),
               radial-gradient(60% 40% at 80% 100%, rgba(129,140,248,.07), transparent 70%)}
  .g{font-family:"Space Grotesk",sans-serif}
  .num{font-variant-numeric:tabular-nums}
  .lbl{font-family:"Space Grotesk",sans-serif;font-size:11px;line-height:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .ui{font-size:12px;line-height:16px;font-weight:500;letter-spacing:.01em}
  .sm{font-size:13px;line-height:18px}
  .sec{color:var(--sec)} .mut{color:var(--mut)}
  .glass{background:var(--glass);backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);border:1px solid var(--stroke);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 10px 36px rgba(0,0,0,.38);border-radius:20px}
  .sub{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.05);border-radius:14px}
  .deep{background:rgba(10,10,15,.7);border:1px solid rgba(255,255,255,.05);border-radius:14px}
  .well{background:var(--void);border:1px solid var(--stroke);border-radius:12px;color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s;width:100%}
  .well:focus{border-color:#818CF8;box-shadow:0 0 0 4px rgba(129,140,248,.15)}
  .well::placeholder{color:#475569}
  .bare{background:transparent;border:0;outline:none;color:inherit;width:100%;min-width:0}
  .bare::placeholder{color:#475569}
  .bare:focus{box-shadow:0 1px 0 0 #818CF8}
  input[type=time]{color-scheme:dark}
  input[type=time]::-webkit-calendar-picker-indicator{opacity:.45;margin-left:2px}
  .ico{width:20px;height:20px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .ico.fill{fill:currentColor}
  .press{transition:transform .15s ease,background-color .2s,opacity .2s}
  .press:active{transform:scale(.96)}
  .chip{font-family:"Space Grotesk",sans-serif;font-size:11px;line-height:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    padding:3px 8px;border-radius:8px;background:rgba(255,255,255,.06);white-space:nowrap}
  .bar{height:6px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .acc-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .3s ease}
  .acc-body>div{overflow:hidden}
  .acc.closed .acc-body{grid-template-rows:0fr}
  .acc .chev{transition:transform .3s ease}
  .acc.closed .chev{transform:rotate(180deg)}
  .rng circle{transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
  .fade{animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .strike{text-decoration:line-through;opacity:.6}
  .sheet-wrap{position:fixed;inset:0;z-index:60;background:rgba(10,10,15,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
  .sheet-wrap.open{opacity:1;pointer-events:auto}
  .sheet{transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);border-radius:24px 24px 0 0;width:100%;max-width:480px}
  .sheet-wrap.open .sheet{transform:none}
  .fab{transition:transform .25s ease, box-shadow .3s}
  .fab.on{transform:rotate(45deg)}
  .toast{position:fixed;left:50%;top:calc(88px + env(safe-area-inset-top));transform:translate(-50%,-12px);opacity:0;z-index:80;transition:all .25s;pointer-events:none}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  textarea{resize:none}
  .dock a.on .dot{opacity:1}
  .pt-safe{padding-top:env(safe-area-inset-top)}
  .pb-safe{padding-bottom:env(safe-area-inset-bottom)}
</style>
</head>
<body>

<!-- ============ HEADER ============ -->
<header class="fixed top-0 inset-x-0 z-50 pt-safe" style="background:rgba(10,10,15,.78);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid rgba(255,255,255,.05)">
  <div class="h-[72px] px-5 flex items-center justify-between gap-2 max-w-[520px] mx-auto">
    <div class="flex items-center gap-2.5 min-w-0">
      <img src="icons/icon-192.png" alt="Raherishi" class="w-9 h-9 rounded-[10px] shrink-0" style="border:1px solid rgba(255,255,255,.12)">
      <div class="flex flex-col min-w-0">
        <div class="flex items-center gap-1.5 min-w-0">
          <span class="g text-[20px] leading-7 font-semibold tracking-tight shrink-0">Raherishi</span>
          <span class="lbl sec truncate" id="hdr-zone">• Health Hub</span>
        </div>
        <span class="ui sec truncate">Living beyond the charted</span>
      </div>
    </div>
    <div class="flex items-center gap-2 shrink-0">
      <div class="lbl px-2.5 py-1 rounded-full flex items-center gap-1.5" style="background:rgba(255,255,255,.06)">
        <span class="w-1.5 h-1.5 rounded-full" style="background:var(--z)"></span><span id="hdr-date" class="num">—</span>
      </div>
      <button class="relative w-10 h-10 rounded-full flex items-center justify-center press" data-act="tab:profile" aria-label="Profile"
        style="background:linear-gradient(140deg,#818CF8,#22C55E 55%,#F59E0B)">
        <span class="w-[36px] h-[36px] rounded-full flex items-center justify-center g font-bold" style="background:#13131A">R</span>
        <span id="hdr-sync" class="absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full border-2" style="border-color:#0A0A0F;background:#27272A"></span>
      </button>
    </div>
  </div>
</header>

<!-- ============ MAIN ============ -->
<main class="relative z-10 w-full max-w-[520px] mx-auto px-4 pb-36" style="padding-top:calc(84px + env(safe-area-inset-top))">
  <!-- Zone switcher rail -->
  <div class="w-full p-1.5 rounded-full flex items-center justify-between mb-4" style="background:#0E0E13;border:1px solid rgba(255,255,255,.05)" id="rail"></div>
  <div id="view"></div>
</main>

<!-- ============ FAB + DOCK ============ -->
<nav class="dock fixed bottom-0 left-0 right-0 z-40 pb-safe pointer-events-none">
  <div class="max-w-[520px] mx-auto px-4 pb-4 flex items-center gap-3">
    <div class="flex-1 h-16 rounded-full flex items-center justify-around px-2 pointer-events-auto"
      style="background:rgba(31,31,37,.82);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.08);box-shadow:0 4px 24px rgba(0,0,0,.35)" id="dock"></div>
    <button class="fab w-14 h-14 rounded-full flex items-center justify-center pointer-events-auto press shrink-0" id="fab" data-act="fab" aria-label="Quick capture"
      style="background:#E4E1E9;color:#131318;box-shadow:0 4px 20px rgba(0,0,0,.4),0 0 16px color-mix(in srgb,var(--z) 45%,transparent)">
      <svg class="ico" style="width:28px;height:28px;stroke-width:2.2"><use href="#i-plus"/></svg>
    </button>
  </div>
</nav>

<!-- ============ QUICK CAPTURE SHEET ============ -->
<div class="sheet-wrap" id="sheet" data-act="closeSheetBg">
  <div class="sheet glass p-5 pb-8 space-y-4" style="border-radius:24px 24px 0 0" onclick="event.stopPropagation()">
    <div class="w-12 h-1 rounded-full mx-auto" style="background:#35343a"></div>
    <div class="flex items-center justify-between">
      <div>
        <h3 class="g text-[17px] font-semibold">Quick Capture</h3>
        <p class="ui sec">Note, water, meals — one tap</p>
      </div>
      <button class="w-9 h-9 rounded-full flex items-center justify-center press" style="background:#35343a" data-act="closeSheet" aria-label="Close"><svg class="ico" style="width:18px;height:18px"><use href="#i-x"/></svg></button>
    </div>
    <textarea id="sheet-text" rows="3" class="well p-3 sm" placeholder="What's on your mind?"></textarea>
    <div class="flex gap-2 flex-wrap" id="sheet-tags"></div>
    <button class="w-full py-3 rounded-xl g font-semibold press" style="background:var(--z);color:#0A0A0F" data-act="sheetSave">Save note</button>
    <div class="grid grid-cols-2 gap-2">
      <button class="sub p-3 flex items-center gap-2.5 text-left press" data-act="qWater"><svg class="ico" style="color:#22C55E"><use href="#i-drop"/></svg><div><span class="sm font-semibold block">Next water</span><span class="ui sec">Fill next unit</span></div></button>
      <button class="sub p-3 flex items-center gap-2.5 text-left press" data-act="qMeal"><svg class="ico" style="color:#22C55E"><use href="#i-food"/></svg><div><span class="sm font-semibold block">Tick next meal</span><span class="ui sec">Mark as logged</span></div></button>
      <button class="sub p-3 flex items-center gap-2.5 text-left press" data-act="qMover"><svg class="ico" style="color:#818CF8"><use href="#i-lotus"/></svg><div><span class="sm font-semibold block">Next MOVER</span><span class="ui sec">Complete ritual step</span></div></button>
      <button class="sub p-3 flex items-center gap-2.5 text-left press" data-act="sync"><svg class="ico" style="color:#F59E0B"><use href="#i-sync"/></svg><div><span class="sm font-semibold block">Sync now</span><span class="ui sec">Push to Sheets</span></div></button>
    </div>
  </div>
</div>

<div class="toast glass px-4 py-2.5 sm font-medium" id="toast"></div>

<script>
/* =====================================================================
   RAHERISHI LIFE OS v3 — single-file PWA

const ZONE = { health:'#22C55E', wealth:'#F59E0B', happy:'#818CF8', profile:'#94A3B8' };

/* ---------- date helpers ---------- */
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today = () => ymd(new Date());
const parseD = s => new Date(s+'T00:00:00');
const addDays = (s,n) => { const d=parseD(s); d.setDate(d.getDate()+n); return ymd(d); };
const dayDiff = (a,b) => Math.round((parseD(b)-parseD(a))/864e5);
const t12 = hm => { const [h,m]=hm.split(':').map(Number); return ((h%12)||12)+':'+pad(m)+(h<12?' AM':' PM'); };
const splitFor = date => SPLITS[DAY_SPLIT[parseD(date).getDay()]];

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => parseFloat(String(v??'').replace(/[^\d.]/g,'')) || 0;
const inr = n => '₹'+Math.round(n).toLocaleString('en-IN');
const inrShort = n => n>=1e7 ? '₹'+(n/1e7).toFixed(2)+'Cr' : n>=1e5 ? '₹'+(n/1e5).toFixed(2)+'L' : inr(n);
const ic = (id,cls='',style='') => `<svg class="ico ${cls}" style="${style}"><use href="#i-${id}"/></svg>`;
const ago = ts => { const s=(Date.now()-ts)/1000; if(s<60) return 'just now'; if(s<3600) return Math.floor(s/60)+'m ago'; if(s<86400) return Math.floor(s/3600)+'h ago'; return Math.floor(s/86400)+'d ago'; };

/* ---------- state ---------- */
const DEF_SLEEP = { at:'22:59', wake:'06:29' };
function fresh(){
  return { sets:{}, water:[], meals:{}, mealTxt:{}, movers:{M:false,O:false,V:false,R:false,S:false}, tl:{}, checks:{}, notes:[],
    kpi:{earning:'',bank:'',clients:'',dw:''}, clients:[], sleep:{...DEF_SLEEP}, rating:0, wdScores:{},
    inlines:{wg0:'',wg1:'',wg2:'',book0:'',film0:'',learn0:'',scribe0:''}, cheat:'', contentIdea:'', creatine:false, improve:[],
    sheetsUrl:'', lastDay:today(), lastSync:0,
    /* sync bookkeeping */ updatedAt:0, clientsAt:0, dirty:false, queue:[], delNotes:[], delImprove:[], history:{} };
}
let state = load();
let ui = (()=>{ try{ return JSON.parse(localStorage.getItem(UIKEY))||{}; }catch(e){ return {}; } })();
ui.tab = ui.tab || 'health'; ui.closed = ui.closed || {}; ui.noteFilter = ui.noteFilter || 'All'; ui.noteTag = ui.noteTag || 'General';
ui.sheetTag = ui.sheetTag || 'General'; ui.range = ui.range || 'today'; ui.impCat = ui.impCat || 'System';
let editSeq = 0, syncing = false, syncState = { s:'off', msg:'' };

function load(){
  let s; try{ s = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  const base = fresh();
  if(!s) return base;
  const m = { ...base, ...s };
  m.kpi = { ...base.kpi, ...(s.kpi||{}) }; m.movers = { ...base.movers, ...(s.movers||{}) };
  m.inlines = { ...base.inlines, ...(s.inlines||{}) }; m.sleep = { ...base.sleep, ...(s.sleep||{}) };
  return m;
}
function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ toast('Storage full — export & clear history'); } }
function saveUI(){ try{ localStorage.setItem(UIKEY, JSON.stringify(ui)); }catch(e){} }
function touch(){ state.updatedAt = Date.now(); state.dirty = true; editSeq++; saveLocal(); }

/* ---------- metrics ---------- */
function sleepHrs(sl){ const [ah,am]=sl.at.split(':').map(Number), [wh,wm]=sl.wake.split(':').map(Number);
  let m = (wh*60+wm) - (ah*60+am); if(m<0) m += 1440; return Math.round(m/6)/10; }
function calc(date = today()){
  const sp = splitFor(date), total = sp.list.length*3; let done = 0;
  for(let e=0;e<sp.list.length;e++) for(let s=0;s<3;s++) if(state.sets[`${date}-e${e}-s${s}`]) done++;
  const waterMl = state.water.reduce((a,i)=>a+(WATER[i]||0),0);
  const meals = MEALS.filter((_,i)=>state.meals[i]).length;
  const movers = MOVERS.filter(m=>state.movers[m[0]]).length;
  const sh = sleepHrs(state.sleep);
  const w = Math.round(done/total*100);
  const d = Math.round((meals/6*0.6 + Math.min(waterMl/WATER_TOTAL,1)*0.3 + (state.creatine?0.1:0))*100);
  const m = movers*20;
  const live = Math.round((w + d + m + Math.min(sh/8,1)*100)/4);
  return { sp, total, done, waterMl, meals, movers, sh, w, d, m, live };
}
function dayState(date){
  const sets = {}; Object.keys(state.sets).forEach(k=>{ if(k.startsWith(date) && state.sets[k]) sets[k]=true; });
  const checks = {}; Object.keys(state.checks).forEach(k=>{ if(/^(ct|ps)/.test(k)) checks[k]=state.checks[k]; });
  return { sets, water:state.water, meals:state.meals, mealTxt:state.mealTxt, movers:state.movers, tl:state.tl, sleep:state.sleep,
    rating:state.rating, creatine:state.creatine, cheat:state.cheat, checks, contentIdea:state.contentIdea, kpi:state.kpi,
    inlines:{ book0:state.inlines.book0, scribe0:state.inlines.scribe0, film0:state.inlines.film0, learn0:state.inlines.learn0 } };
}
function applyDayState(ds){
  if(!ds) return;
  ['water','meals','mealTxt','tl','rating','creatine','cheat','contentIdea'].forEach(k=>{ if(ds[k]!==undefined) state[k]=ds[k]; });
  if(ds.sets) state.sets = ds.sets;
  if(ds.movers) state.movers = { ...state.movers, ...ds.movers };
  if(ds.sleep) state.sleep = { ...state.sleep, ...ds.sleep };
  if(ds.kpi) state.kpi = { ...state.kpi, ...ds.kpi };
  if(ds.inlines) state.inlines = { ...state.inlines, ...ds.inlines };
  if(ds.checks){ Object.keys(state.checks).forEach(k=>{ if(/^(ct|ps)/.test(k)) delete state.checks[k]; }); Object.assign(state.checks, ds.checks); }
}
function snap(date){
  const c = calc(date);
  const dayNotes = state.notes.filter(n=>ymd(new Date(n.ts))===date).map(n=>`[${n.tag}] ${n.text}`).join(' | ');
  return { date, workoutPct:c.w, dietPct:c.d, moversPct:c.m, sleepHrs:c.sh, waterMl:c.waterMl,
    earning:num(state.kpi.earning), bank:num(state.kpi.bank), clients:num(state.kpi.clients), deepWork:num(state.kpi.dw),
    rating:state.rating, notes:dayNotes, wdScores:JSON.stringify(state.wdScores), updatedAt:state.updatedAt||Date.now(),
    stateJson:JSON.stringify(dayState(date)) };
}

/* ---------- daily reset at midnight ---------- */
function rollover(){
  const t = today();
  if(state.lastDay === t) return false;
  const prev = state.lastDay;
  if(prev){ const row = snap(prev); state.history[prev] = row; state.queue.push(row); }
  state.sets = {}; state.water = []; state.meals = {}; state.mealTxt = {}; state.tl = {};
  state.movers = {M:false,O:false,V:false,R:false,S:false}; state.sleep = {...DEF_SLEEP};
  state.rating = 0; state.creatine = false; state.cheat = ''; state.kpi.dw = '';
  state.inlines.scribe0 = ''; state.inlines.film0 = ''; state.inlines.learn0 = '';
  Object.keys(state.checks).forEach(k=>{ if(/^(ct|ps)/.test(k)) delete state.checks[k]; });
  const keys = Object.keys(state.history).sort(); while(keys.length>400) delete state.history[keys.shift()];
  state.lastDay = t; state.updatedAt = Date.now(); state.dirty = true; editSeq++; saveLocal();
  return true;
}

    const on = ui.tab===id;
    return `<a href="#" class="relative flex flex-col items-center justify-center min-w-[56px] min-h-[44px] press ${on?'on':''}" data-act="tab:${id}" style="color:${on?'#F8FAFC':'#94A3B8'}">

  v.innerHTML = `<div class="${anim?'fade ':''}space-y-4">${({health:vHealth,wealth:vWealth,happy:vHappy,profile:vProfile})[ui.tab]()}</div>`;
  derive();
  paintSync();
}

function ring(id, label){
  return `<div class="glass p-2.5 flex flex-col items-center text-center" style="border-radius:16px">
    <div class="relative w-12 h-12 flex items-center justify-center rng">
      <svg class="w-full h-full -rotate-90" viewBox="0 0 40 40">
        <circle cx="20" cy="20" r="16" fill="none" stroke="#27272A" stroke-width="4"/>
        <circle id="${id}-c" cx="20" cy="20" r="16" fill="none" stroke="#22C55E" stroke-width="4" stroke-linecap="round" stroke-dasharray="100.53" stroke-dashoffset="100.53"/>
      </svg>
      <span class="absolute g text-[11px] font-bold num" id="${id}-v">0%</span>
    </div>
    <span class="lbl mt-1.5">${label}</span>
    <span class="text-[10px] leading-4 sec num" id="${id}-s"></span>
  </div>`;
}
function setRing(id, frac, val, sub, color){
  const c = document.getElementById(id+'-c'); if(!c) return;
  c.setAttribute('stroke-dashoffset', (100.53*(1-Math.max(0,Math.min(1,frac)))).toFixed(2));
  if(color) c.setAttribute('stroke', color);
  document.getElementById(id+'-v').textContent = val;
  document.getElementById(id+'-s').textContent = sub;
}
const setTxt = (id, t) => { const e=document.getElementById(id); if(e) e.textContent = t; };
const setW = (id, p, col) => { const e=document.getElementById(id); if(e){ e.style.width = Math.max(0,Math.min(100,p))+'%'; if(col) e.style.background = col; } };
function tick(on, color, size=22){
  return on ? `<span class="rounded-full flex items-center justify-center shrink-0" style="width:${size}px;height:${size}px;background:${color};color:#0A0A0F">${ic('check','',`width:${size*.65}px;height:${size*.65}px;stroke-width:3`)}</span>`
            : `<span class="block rounded-full shrink-0" style="width:${size}px;height:${size}px;border:2px solid #3F3F46"></span>`;
}
function box(on, color){
  return on ? `<span class="w-6 h-6 rounded-md flex items-center justify-center shrink-0" style="background:${color};color:#0A0A0F">${ic('check','','width:16px;height:16px;stroke-width:3')}</span>`

}

      <select id="imp-cat" class="well px-3 py-2 sm flex-1">${cats}</select>
      <button class="px-4 rounded-xl lbl press" style="background:#F59E0B;color:#0A0A0F" data-act="addImp">Add idea</button>
    </div>
    <div class="space-y-1.5">${imps||'<p class="ui sec px-1">No ideas yet.</p>'}</div>`)}

  ${acc('export','down',P,'Export Reports',{text:'CSV + TXT downloads'},'b-exp',`
    <div class="p-1 rounded-full flex" style="background:#0E0E13">${ranges}</div>
    <pre class="deep p-3 text-[11px] leading-4 whitespace-pre-wrap max-h-[300px] overflow-y-auto num" style="font-family:ui-monospace,Menlo,monospace;color:#C6C5D5" id="report">Building report…</pre>
    <div class="grid grid-cols-2 gap-2">
      <button class="py-2.5 rounded-xl lbl flex items-center justify-center gap-1.5 press" style="background:${P};color:#0A0A0F" data-act="csv">${ic('down','','width:15px;height:15px;stroke-width:2.4')} Export CSV</button>
      <button class="py-2.5 rounded-xl lbl flex items-center justify-center gap-1.5 press" style="background:#35343a" data-act="txt">${ic('note','','width:15px;height:15px')} Export TXT</button>
    </div>`)}

  <section class="glass p-4 space-y-3">
    <div class="flex items-center gap-2">${ic('db','',`color:${N}`)}<h3 class="g text-[17px] font-semibold">Storage</h3></div>
    <div class="grid grid-cols-2 gap-2 sm" id="storage"></div>
    <button class="w-full py-3 rounded-xl lbl flex items-center justify-center gap-1.5 press" style="background:#EF44441A;color:#EF4444;border:1px solid #EF444440" data-act="resetToday">${ic('reset','','width:15px;height:15px')} Reset today's data</button>
  </section>`;
}

/* =====================================================================
   DERIVED VALUES (update without rebuilding inputs)
   ===================================================================== */
function derive(){
  const G = ZONE.health, A = ZONE.wealth;
  if(ui.tab==='health'){
    const c = calc();
    setRing('r-w', c.w/100, c.w+'%', `${c.done}/${c.total} sets`);
    setRing('r-d', c.d/100, c.d+'%', `${c.meals}/6 meals`);
    setRing('r-m', c.m/100, c.m+'%', `${c.movers}/5 done`);
    setRing('r-s', c.sh/8, c.sh+'h', c.sh>=7?'Recovered':'Short');
    setTxt('live-pct', 'Live '+c.live+'%');
    setTxt('wo-pct', c.w+'% Done'); setW('wo-bar', c.w);
    setTxt('b-wo', `${c.done}/${c.total}`);
    setTxt('water-stat', `${(c.waterMl/1000).toFixed(2).replace(/0$/,'')}L / ${WATER_TOTAL/1000}L`);
    setTxt('b-diet', `${(c.waterMl/1000).toFixed(1)}L`);
    setTxt('diet-sub', `${c.meals}/6 meals • creatine ${state.creatine?'taken':'pending'}`);
    setTxt('b-mov', `${c.m}%`); setTxt('mov-sub', `${c.movers}/5 completed • Mind mastery`);
    const hh = Math.floor(c.sh), mm = Math.round((c.sh-hh)*60);
    setTxt('b-sleep', `${c.sh} H`); setTxt('sleep-sub', `Slept ${hh}h ${pad(mm)}m • target 7h 30m`);
    setTxt('sleep-win', `${hh}h ${pad(mm)}m window`);
    setTxt('tl-count', `${Object.values(state.tl).filter(Boolean).length} / ${TL.length}`);
  }
  if(ui.tab==='wealth'){
    const k = state.kpi;
    [['earning',v=>`${inr(v)} of ${inr(TARGETS.earning)}`],['bank',v=>`${inr(v)} of ${inr(TARGETS.bank)}`],
     ['clients',()=> 'Direct mandates'],['dw',()=> 'Today’s focused hours']].forEach(([key,sub])=>{
      const v = num(k[key]), p = Math.round(v/TARGETS[key]*100);
      setTxt(`k-${key}-pct`, p+'%'); setW(`k-${key}-bar`, p);
      setTxt(`k-${key}-chip`, key==='earning'||key==='bank' ? inrShort(v) : p>=100?'Hit':(+(TARGETS[key]-v).toFixed(1))+(key==='dw'?'h':'')+' left');
      setTxt(`k-${key}-sub`, sub(v));
    });
    const tot = state.clients.reduce((a,c)=>a+num(c.a),0);
    setTxt('pipe-total', `${state.clients.length} • ${inrShort(tot)}/mo`);
  }
  if(ui.tab==='profile'){
    setTxt('p-days', Object.keys(state.history).length+1);
    setTxt('b-imp', state.improve.length);
    setTxt('b-exp', ({today:'Today',week:'7D',month:'30D'})[ui.range]);
    const bytes = new Blob([localStorage.getItem(KEY)||'']).size;
    const st = document.getElementById('storage');
    if(st) st.innerHTML = [['Local cache',(bytes/1024).toFixed(1)+' KB'],['History days',Object.keys(state.history).length],
      ['Notes / ideas',state.notes.length+' / '+state.improve.length],['Last sync',state.lastSync?ago(state.lastSync):'never']]
      .map(([l,v])=>`<div class="sub p-3"><p class="ui sec">${l}</p><p class="g text-[17px] font-semibold num">${v}</p></div>`).join('');
    buildReport(false);
  }
}

/* =====================================================================
   ACTIONS
   ===================================================================== */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]'); if(!el) return;
  if(el.tagName==='A') e.preventDefault();
  const [act, a, b] = el.dataset.act.split(':');
  const t = today();
  switch(act){
    case 'tab': ui.tab = a; saveUI(); render(true); window.scrollTo({top:0,behavior:'smooth'}); return;
    case 'acc': ui.closed[a] = !ui.closed[a]; saveUI(); document.getElementById('acc-'+a).classList.toggle('closed', ui.closed[a]); return;
    case 'set': { const k = `${t}-e${a}-s${b}`; if(state.sets[k]) delete state.sets[k]; else state.sets[k] = true; break; }
    case 'wd': state.wdScores[a] = ((state.wdScores[a]||0)+1)%6; break;
    case 'rate': state.rating = state.rating===+a ? 0 : +a; break;
    case 'water': { const i = +a, at = state.water.indexOf(i); if(at>-1) state.water.splice(at,1); else state.water.push(i); break; }
    case 'meal': state.meals[a] = !state.meals[a]; break;
    case 'creatine': state.creatine = !state.creatine; break;
    case 'mover': state.movers[a] = !state.movers[a]; linkMover(a); break;
    case 'tl': state.tl[a] = !state.tl[a]; break;
    case 'chk': state.checks[a] = !state.checks[a]; break;
    case 'ps': state.checks['ps'+a] = !state.checks['ps'+a]; if(a==='0') state.movers.R = state.checks.ps0; if(a==='1') state.movers.S = state.checks.ps1; break;
    case 'addClient': state.clients.push({n:'',a:''}); state.clientsAt = Date.now(); touch(); render();
      setTimeout(()=>{ const ins = document.querySelectorAll('#pipe-list input[data-in$=".n"]'); ins[ins.length-1]?.focus(); }, 50); return;
    case 'delClient': if(state.clients[a] && (state.clients[a].n||state.clients[a].a) && !confirm('Remove '+(state.clients[a].n||'this client')+'?')) return;
      state.clients.splice(+a,1); state.clientsAt = Date.now(); break;
    case 'nf': ui.noteFilter = a; saveUI(); render(); return;
    case 'nt': ui.noteTag = a; saveUI(); render(); return;
    case 'addNote': { const ta = $('#note-text'); if(!ta.value.trim()) return toast('Write something first');
      addNote(ta.value.trim(), ui.noteTag); return; }
    case 'delNote': if(!confirm('Delete this note?')) return; state.notes = state.notes.filter(n=>n.ts!==+a); state.delNotes.push(+a); break;
    case 'fab': openSheet(); return;
    case 'closeSheet': case 'closeSheetBg': closeSheet(); return;
    case 'st': ui.sheetTag = a; saveUI(); paintSheetTags(); return;
    case 'sheetSave': { const ta = $('#sheet-text'); if(!ta.value.trim()) return toast('Write something first');
      addNote(ta.value.trim(), ui.sheetTag); ta.value=''; closeSheet(); return; }
    case 'qWater': { const nx = WATER.findIndex((_,i)=>!state.water.includes(i)); if(nx<0) { toast('Hydration maxed — 4L done'); return; }
      state.water.push(nx); touch(); render(); toast(`+${WATER[nx]} ml logged`); return; }
    case 'qMeal': { const nx = MEALS.findIndex((_,i)=>!state.meals[i]); if(nx<0){ toast('All 6 meals logged'); return; }
      state.meals[nx] = true; touch(); render(); toast(MEALS[nx][1]+' logged'); return; }
    case 'qMover': { const nx = MOVERS.find(m=>!state.movers[m[0]]); if(!nx){ toast('MOVERS already complete'); return; }
      state.movers[nx[0]] = true; linkMover(nx[0]); touch(); render(); toast(nx[2]+' complete'); return; }
    case 'sync': syncNow(true); return;
    case 'saveUrl': { const u = $('#sheets-url').value.trim();
      if(u && !/^https:\/\/script\.google(usercontent)?\.com\//.test(u)) return toast('That doesn’t look like an Apps Script URL');
      state.sheetsUrl = u; saveLocal(); toast(u?'URL saved — syncing…':'Sync disconnected'); paintSync(); if(u) syncNow(true); return; }
    case 'addImp': { const ta = $('#imp-text'); if(!ta.value.trim()) return toast('Describe the idea first');
      ui.impCat = $('#imp-cat').value; saveUI(); state.improve.push({ text:ta.value.trim(), cat:ui.impCat, ts:Date.now() }); break; }
    case 'delImp': if(!confirm('Delete this idea?')) return; state.improve = state.improve.filter(m=>m.ts!==+a); state.delImprove.push(+a); break;
    case 'range': ui.range = a; saveUI(); render(); return;
    case 'csv': exportFile('csv'); return;
    case 'txt': exportFile('txt'); return;
    case 'resetToday': if(!confirm('Reset all of today’s workout, diet, movers, sleep and daily checklists?')) return;
      state.lastDay = ''; const keepQ = state.queue.length; rollover(); state.queue.length = keepQ; state.lastDay = today(); touch(); render(); toast('Today reset'); return;
    default: return;
  }
  touch(); render();
});
function linkMover(k){ if(k==='R') state.checks.ps0 = state.movers.R; if(k==='S') state.checks.ps1 = state.movers.S; }
function addNote(text, tag){ state.notes.push({ text, tag, ts:Date.now() }); touch(); render(); toast('Note saved'); }

document.addEventListener('input', e=>{
  const el = e.target; if(!el.dataset || !el.dataset.in) return;
  const path = el.dataset.in.split('.');
  let o = state; for(let i=0;i<path.length-1;i++) o = o[path[i]];
  o[path[path.length-1]] = el.value;
  if(path[0]==='clients') state.clientsAt = Date.now();
  if(path[0]==='sleep' && !el.value) return;
  touch(); derive();
});

/* ---------- sheet ---------- */
function paintSheetTags(){
  $('#sheet-tags').innerHTML = TAGS.map(([tg,col])=>{ const on = ui.sheetTag===tg;
    return `<button class="px-3 py-1.5 rounded-full ui press" data-act="st:${tg}" style="background:${on?col:'#1B1B20'};color:${on?'#0A0A0F':col}">${tg}</button>`; }).join('');
}
function openSheet(){ if(ui.tab!=='profile') ui.sheetTag = ({health:'Health',wealth:'Wealth',happy:'Happy'})[ui.tab]; paintSheetTags();
  $('#sheet').classList.add('open'); $('#fab').classList.add('on'); setTimeout(()=>$('#sheet-text').focus(), 280); }
function closeSheet(){ $('#sheet').classList.remove('open'); $('#fab').classList.remove('on'); }

let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 2200); }

/* =====================================================================
   GOOGLE SHEETS SYNC
   ===================================================================== */
function setSync(s, msg=''){ syncState = { s, msg }; paintSync(); }
function paintSync(){
  const s = state.sheetsUrl ? syncState.s : 'off';
  const col = { off:'#27272A', busy:'#F59E0B', ok:'#22C55E', err:'#EF4444', idle:'#94A3B8' }[s] || '#94A3B8';
  const hd = $('#hdr-sync'); if(hd) hd.style.background = col;
  const dot = document.getElementById('sync-dot'); if(!dot) return;
  dot.style.background = col; dot.style.boxShadow = s==='ok'||s==='busy' ? `0 0 8px ${col}` : 'none';
  setTxt('sync-title', { off:'Not connected', busy:'Syncing…', ok:'Synced', err:'Sync error', idle:'Connected' }[s]);
  setTxt('sync-msg', s==='err' ? syncState.msg : state.lastSync ? 'Last sync '+ago(state.lastSync)+(state.dirty?' • changes pending':'') : state.sheetsUrl ? 'Waiting for first sync' : 'Paste your Apps Script URL above');
  setTxt('b-sync', { off:'Offline', busy:'…', ok:'Live', err:'Error', idle:'Ready' }[s]);
}
async function api(method, params, body){
  const url = state.sheetsUrl.trim();
  const q = params ? '?'+new URLSearchParams(params).toString() : '';
  const r = await fetch(url+q, method==='POST'
    ? { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body), redirect:'follow' }
    : { method:'GET', redirect:'follow' });
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j = await r.json(); if(!j.ok) throw new Error(j.error||'Server error'); return j;
}
async function push(){
  const seq = editSeq;
  await api('POST', null, {
    action:'save', days:[...state.queue, snap(today())],
    notes:state.notes, improvements:state.improve, delNotes:state.delNotes, delImprove:state.delImprove,
    clients:state.clients.map((c,i)=>({ idx:i+1, name:c.n, amount:num(c.a) })), clientsAt:state.clientsAt,
    wdScores:state.wdScores
  });
  state.queue = []; state.delNotes = []; state.delImprove = [];
  if(seq===editSeq) state.dirty = false;
}
async function pull(from, to){
  const j = await api('GET', { action:'get', from: from||addDays(today(),-40), to: to||today() });
  const t = today();
  (j.daily||[]).forEach(r=>{
    if(r.date===t){
      if(Number(r.updatedAt) > (state.updatedAt||0) && !state.dirty){
        try{ applyDayState(JSON.parse(r.stateJson||'null')); }catch(e){}
        state.updatedAt = Number(r.updatedAt);
      }
    } else { const { stateJson, ...lite } = r; state.history[r.date] = lite; }
  });
  const merge = (local, remote, dels) => { const m = new Map(local.map(x=>[x.ts,x])); (remote||[]).forEach(x=>{ if(!dels.includes(x.ts)) m.set(x.ts,x); }); return [...m.values()]; };
  state.notes = merge(state.notes, (j.notes||[]).map(n=>({ text:n.text, tag:n.tag, ts:Number(n.ts) })), state.delNotes);
  state.improve = merge(state.improve, (j.improvements||[]).map(n=>({ text:n.text, cat:n.cat, ts:Number(n.ts) })), state.delImprove);
  if(j.clients && Number(j.clientsAt||0) > (state.clientsAt||0)){
    state.clients = j.clients.map(c=>({ n:String(c.name??''), a:c.amount===''||c.amount==null?'':String(c.amount) }));
    state.clientsAt = Number(j.clientsAt);
  }
  if(j.wdScores) Object.entries(j.wdScores).forEach(([d,s])=>{ s = Number(s)||0; if(s) state.wdScores[d] = s; else delete state.wdScores[d]; });
  return j;
}
async function syncNow(manual, onLoad){
  if(!state.sheetsUrl.trim()){ if(manual) toast('Add your Sheets URL in Profile → Settings'); setSync('off'); return; }
  if(syncing) return; syncing = true; setSync('busy');
  try{
    if(onLoad){ await pull(); if(state.dirty || state.queue.length) await push(); }
    else { if(state.dirty || state.queue.length || manual) await push(); await pull(); }
    state.lastSync = Date.now(); saveLocal(); setSync('ok');
    if(document.activeElement?.dataset?.in === undefined) render(); else derive();
    if(manual) toast('Synced with Google Sheets');
  }catch(err){
    setSync('err', String(err.message||err)); if(manual) toast('Sync failed: '+(err.message||err));
  }
  syncing = false;
}

/* =====================================================================
   REPORTS / EXPORT
   ===================================================================== */
const COLS = ['date','workoutPct','dietPct','moversPct','sleepHrs','waterMl','earning','bank','clients','deepWork','rating','wdScore','notes'];
function rangeDates(){ const t = today(); const n = { today:0, week:6, month:29 }[ui.range]; return [addDays(t,-n), t]; }
function collectRows(){
  const [from,to] = rangeDates(), rows = [];
  for(let d=from; d<=to; d=addDays(d,1)){
    const r = d===today() ? snap(d) : state.history[d];
    if(r) rows.push({ ...r, wdScore: state.wdScores[d]||0 });
  }
  return { from, to, rows };
}
function reportText({from,to,rows}){
  const label = { today:'Today', week:'Last Week', month:'Last Month' }[ui.range];
  const avg = k => rows.length ? (rows.reduce((a,r)=>a+(Number(r[k])||0),0)/rows.length) : 0;
  const last = rows[rows.length-1] || {};
  const notes = state.notes.filter(n=>{ const d = ymd(new Date(n.ts)); return d>=from && d<=to; }).sort((a,b)=>a.ts-b.ts);
  const L = [];
  L.push('RAHERISHI LIFE OS — REPORT', `${label}: ${from} → ${to}`, `Days logged: ${rows.length}`, '');
  L.push('HEALTH (averages)',
    `  Workout ${avg('workoutPct').toFixed(0)}%  |  Diet ${avg('dietPct').toFixed(0)}%  |  Movers ${avg('moversPct').toFixed(0)}%`,
    `  Sleep ${avg('sleepHrs').toFixed(1)}h  |  Water ${(avg('waterMl')/1000).toFixed(1)}L  |  Rating ${avg('rating').toFixed(1)}/5`, '');
  L.push('WEALTH (latest)',
    `  Earning ${inr(Number(last.earning)||0)} / ${inr(TARGETS.earning)}`,
    `  Bank ${inr(Number(last.bank)||0)} / ${inr(TARGETS.bank)}`,
    `  Clients ${Number(last.clients)||0} / ${TARGETS.clients}  |  Deep work avg ${avg('deepWork').toFixed(1)}h / ${TARGETS.dw}h`, '');
  L.push('DAILY LOG');
  rows.forEach(r=>L.push(`  ${r.date}  W ${String(r.workoutPct).padStart(3)}%  D ${String(r.dietPct).padStart(3)}%  M ${String(r.moversPct).padStart(3)}%  S ${Number(r.sleepHrs).toFixed(1)}h  H2O ${(Number(r.waterMl)/1000).toFixed(1)}L  DW ${Number(r.deepWork)||0}h  R ${r.rating||0}  Score ${r.wdScore||0}`));
  if(!rows.length) L.push('  (no days in range yet)');
  L.push('', `NOTES (${notes.length})`);
  notes.forEach(n=>{ const d = new Date(n.ts); L.push(`  [${n.tag}] ${ymd(d)} ${pad(d.getHours())}:${pad(d.getMinutes())} — ${n.text.replace(/\n/g,' ')}`); });
  L.push('', `Generated ${new Date().toLocaleString('en-IN')}`);
  return L.join('\n');
}
async function buildReport(fetchRemote){
  if(fetchRemote && state.sheetsUrl){
    const [from,to] = rangeDates();
    try{ await pull(from,to); saveLocal(); }catch(e){ toast('Using local data — Sheets unreachable'); }
  }
  const data = collectRows();
  const pre = document.getElementById('report'); if(pre) pre.textContent = reportText(data);
  return data;
}
async function exportFile(kind){
  toast(state.sheetsUrl ? 'Fetching full history…' : 'Building report…');
  const data = await buildReport(true);
  let content, mime;
  if(kind==='csv'){
    const q = v => { const s = String(v??''); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
    content = [COLS.join(','), ...data.rows.map(r=>COLS.map(c=>q(r[c])).join(','))].join('\n');
    mime = 'text/csv;charset=utf-8';
  } else { content = reportText(data); mime = 'text/plain;charset=utf-8'; }
  const blob = new Blob([content], { type:mime }), url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `lifeos-${ui.range}-${today()}.${kind}`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 1500);
  toast(kind.toUpperCase()+' downloaded');
}

/* =====================================================================
   BOOT
   ===================================================================== */
rollover();
render(true);
syncNow(false, true);
setInterval(()=>{ if(rollover()) render(); if(state.sheetsUrl && (state.dirty || state.queue.length || Date.now()-state.lastSync>120000)) syncNow(false); else paintSync(); }, 30000);
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible'){ if(rollover()) render(); syncNow(false); }
  else if(state.sheetsUrl && state.dirty) syncNow(false);
});
